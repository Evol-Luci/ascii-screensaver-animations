<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Matrix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a12;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        body.screensaver-mode { cursor: none; }

        #matrix-canvas {
            display: block;
            opacity: 0;
            transition: opacity 2s ease-in;
        }

        .credits-popup {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background: rgba(10, 10, 18, 0.92);
            border: 1px solid rgba(80, 100, 130, 0.4);
            border-radius: 8px;
            padding: 20px 24px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 12px;
            color: #8899b0;
            max-width: 280px;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            z-index: 100;
            line-height: 1.6;
        }
        .credits-popup.visible { opacity: 1; }
        .credits-popup h2 {
            font-size: 14px;
            font-weight: 700;
            color: #aabbcc;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .credits-popup .credits-label {
            font-size: 10px;
            color: #506070;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            margin-bottom: 4px;
        }
        .credits-popup hr {
            border: none;
            border-top: 1px solid rgba(80, 100, 130, 0.3);
            margin: 12px 0;
        }
        .credits-popup a { color: #6688aa; text-decoration: none; }
    </style>
</head>
<body>
<canvas id="matrix-canvas"></canvas>
<script>
const _params = new URLSearchParams(window.location.search);
const P_SPEED          = parseFloat(_params.get('speed')   || '1');
const P_DENSITY        = parseFloat(_params.get('density') || '1');
const P_PALETTE        = _params.get('palette') || 'green';

const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');

let cw = window.innerWidth;
let ch = window.innerHeight;
canvas.width = cw;
canvas.height = ch;
setTimeout(() => canvas.style.opacity = 1, 100);

const fontSize = 16;
let columns = Math.floor(cw / fontSize);
let drops = [];
const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+{}|[]\\;':\",./<>?~`";

function initDrops() {
    columns = Math.floor(cw / fontSize);
    drops = [];
    for (let x = 0; x < columns; x++) {
        drops[x] = 1;
    }
}
initDrops();

window.addEventListener('resize', () => {
    cw = window.innerWidth;
    ch = window.innerHeight;
    canvas.width = cw;
    canvas.height = ch;
    initDrops();
});

const palettes = {
    'green': '#0F0',
    'blue': '#00F',
    'red': '#F00',
    'hacker': '#32CD32'
};

const color = palettes[P_PALETTE] || '#0F0';

function draw() {
    ctx.fillStyle = 'rgba(10, 10, 18, 0.05)';
    ctx.fillRect(0, 0, cw, ch);
    
    ctx.fillStyle = color;
    ctx.font = fontSize + 'px "JetBrains Mono", monospace';
    
    for (let i = 0; i < drops.length; i++) {
        if (Math.random() > P_DENSITY) continue;

        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        
        if (drops[i] * fontSize > ch && Math.random() > 0.975) {
            drops[i] = 0;
        }
        
        drops[i] += P_SPEED;
    }
}

setInterval(draw, 33);

// ─── Screensaver Dismiss Logic ────────────────────────────────────────────────
if (new URLSearchParams(window.location.search).get('screensaver') === '1') {
    let armed = false;
    setTimeout(() => { armed = true; }, 1500);
    const dismiss = () => {
        if (!armed) return;
        try { window.close(); } catch(e) {}
        document.body.innerHTML = '';
        document.body.style.background = '#000';
    };
    window.addEventListener('keydown', dismiss);
    window.addEventListener('mousedown', dismiss);
    window.addEventListener('mousemove', (() => {
        let lastX = -1, lastY = -1, moveCount = 0;
        return (e) => {
            if (lastX === -1) { lastX = e.clientX; lastY = e.clientY; return; }
            if (e.clientX === lastX && e.clientY === lastY) return;
            lastX = e.clientX; lastY = e.clientY;
            if (++moveCount > 10) dismiss();
        };
    })());
}

</script>
</body>
</html>
