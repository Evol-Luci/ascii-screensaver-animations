<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Ocean</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #05060d;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #backdrop, #ocean-canvas, #vignette {
            position: fixed;
            inset: 0;
            display: block;
        }

        #backdrop, #ocean-canvas {
            opacity: 0;
            transition: opacity 2s ease-in;
        }

        /* Static layers are painted once (backdrop: on resize; vignette: by
           CSS) so each frame only redraws what moves. */
        #vignette {
            pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.55) 100%);
        }
    </style>
</head>
<body>
<canvas id="backdrop"></canvas>
<canvas id="ocean-canvas"></canvas>
<div id="vignette"></div>
<script>
// ─── Parameters ──────────────────────────────────────────────────────────────
const _params = new URLSearchParams(window.location.search);
const P_SPEED   = clamp(parseFloat(_params.get('speed') || '1'), 0.1, 3);
const P_TURB    = clamp(parseFloat(_params.get('turbulence') || '1'), 0.1, 2);
const P_PALETTE = _params.get('palette') || 'deepblue';
const START_AT  = parseInt(_params.get('startAt') || '0', 10);
const DELAYED_START = _params.has('delayedStart');

function clamp(v, lo, hi) { return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : lo; }
function rand(a, b) { return a + Math.random() * (b - a); }
function lerp(a, b, k) { return a + (b - a) * k; }
function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a.toFixed(3)})`;

// skyTop, skyHorizon, water far, water near, foam, light (sun/moon), light is sun?
const PALETTES = {
    deepblue: { skyTop: [4, 6, 18],   skyLow: [18, 30, 64],  far: [40, 90, 160],  near: [10, 50, 120], foam: [200, 230, 255], light: [235, 240, 255], sun: false },
    sunset:   { skyTop: [30, 10, 40], skyLow: [230, 110, 60], far: [240, 150, 90], near: [60, 30, 70],  foam: [255, 220, 180], light: [255, 200, 120], sun: true },
    stormy:   { skyTop: [10, 12, 16], skyLow: [50, 58, 68],  far: [110, 125, 140], near: [30, 40, 50], foam: [210, 220, 230], light: [190, 200, 210], sun: false },
    moonlit:  { skyTop: [2, 4, 10],   skyLow: [16, 22, 40],  far: [150, 170, 210], near: [20, 30, 60],  foam: [220, 235, 255], light: [255, 250, 225], sun: false },
};
const PAL = PALETTES[P_PALETTE] || PALETTES.deepblue;

// ─── Canvas ──────────────────────────────────────────────────────────────────
// Re-measured on every resize: the window may not have its real size yet
// when this script first runs, and a canvas sized once at 0x0 draws nothing.
const canvas = document.getElementById('ocean-canvas');
const ctx = canvas.getContext('2d');
const backdrop = document.getElementById('backdrop');
const bctx = backdrop.getContext('2d');
let W = 0, H = 0, DPR = 1;
let FS = 14, CW = 8.7, horizon = 0;
let stars = [], clouds = [];
const glyphCache = new Map();
// Glyphs cached before the web font arrived were drawn in the fallback font.
if (document.fonts) document.fonts.ready.then(() => { glyphCache.clear(); if (W) paintBackdrop(); });

// The sea is thousands of characters a frame; each (glyph, size, colour) is
// rendered once into a sprite and stamped with drawImage, which is far
// cheaper than fillText. Row colours are quantized by depth; fading is alpha.
function sprite(ch, size, col) {
    size = Math.round(size * 2) / 2;
    const key = ch + '|' + size + '|' + (col[0] | 0) + ',' + (col[1] | 0) + ',' + (col[2] | 0);
    let g = glyphCache.get(key);
    if (!g) {
        if (glyphCache.size > 3000) glyphCache.clear();
        const w = Math.ceil(size * 0.8) + 4, h = Math.ceil(size * 1.3) + 4;
        const c = document.createElement('canvas');
        c.width = Math.ceil(w * DPR); c.height = Math.ceil(h * DPR);
        const x = c.getContext('2d');
        x.scale(DPR, DPR);
        x.font = `700 ${size}px "JetBrains Mono", monospace`;
        x.textAlign = 'center';
        x.textBaseline = 'middle';
        x.fillStyle = rgb(col);
        x.fillText(ch, w / 2, h / 2);
        g = { c, w, h };
        glyphCache.set(key, g);
    }
    return g;
}

function resize() {
    // 1:1 CSS pixels like the other animations: on a scaled display a
    // device-resolution canvas costs ~1.5-2x the GPU upload every frame.
    DPR = 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    glyphCache.clear();
    FS = clamp(Math.round(Math.min(W, H) / 50), 9, 20);
    CW = FS * 0.62;
    horizon = H * 0.46;
    backdrop.width = canvas.width;
    backdrop.height = canvas.height;
    backdrop.style.width = W + 'px';
    backdrop.style.height = H + 'px';
    bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    paintBackdrop();

    stars = [];
    for (let i = 0; i < (W * horizon) / 2600; i++) {
        stars.push({ x: rand(0, W), y: rand(0, horizon * 0.9), b: rand(0.2, 1), p: rand(0, 6.3), s: rand(0.5, 2) });
    }
    clouds = [];
    for (let i = 0; i < 5; i++) clouds.push(newCloud(true));
}
window.addEventListener('resize', resize);
resize();

// Sun or moon position (shared with the glitter path on the water).
function sunX() { return W * 0.62; }

// The parts of the scene that never move, painted only when the size changes.
function paintBackdrop() {
    const ctx = bctx;
    // Sky and sea.
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    const sky = ctx.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, rgb(PAL.skyTop));
    sky.addColorStop(1, rgb(PAL.skyLow));
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, horizon + 1);
    const sea = ctx.createLinearGradient(0, horizon, 0, H);
    sea.addColorStop(0, rgb(mix(PAL.skyLow, PAL.near, 0.5)));
    sea.addColorStop(1, rgb(mix(PAL.near, [0, 0, 0], 0.6)));
    ctx.fillStyle = sea;
    ctx.fillRect(0, horizon, W, H - horizon);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // Sun or moon, low over the water.
    const lx = sunX(), ly = horizon - H * 0.13, lr = Math.min(W, H) * 0.06;
    const halo = ctx.createRadialGradient(lx, ly, 0, lx, ly, lr * 5);
    halo.addColorStop(0, rgb(PAL.light, 0.35));
    halo.addColorStop(1, rgb(PAL.light, 0));
    ctx.fillStyle = halo;
    ctx.fillRect(lx - lr * 5, ly - lr * 5, lr * 10, lr * 10);
    ctx.font = `700 ${FS}px "JetBrains Mono", monospace`;
    for (let y = -lr; y <= lr; y += FS * 0.9) {
        const half = Math.sqrt(Math.max(0, lr * lr - y * y));
        for (let x = -half; x <= half; x += CW) {
            ctx.fillStyle = rgb(PAL.light, 0.9);
            ctx.fillText(PAL.sun ? '#' : (x + y * 0.4 > lr * 0.2 ? ':' : '@'), lx + x, ly + y);
        }
    }

}

function newCloud(anywhere) {
    const len = Math.floor(rand(10, 30));
    return { x: anywhere ? rand(-0.2, 1) * W : -len * CW, y: rand(0.08, 0.36) * horizon,
             len, v: rand(4, 12), shape: Array.from({ length: len }, (_, i) =>
                 Math.sin((i / len) * Math.PI) * rand(0.6, 1)) };
}

// ─── Waves: a sum of travelling sines, larger and faster near the viewer ────
const WAVES = [
    { k: 0.011, w: 0.9, a: 1.0, phase: 0 },
    { k: 0.023, w: 1.4, a: 0.55, phase: 1.7 },
    { k: 0.047, w: 2.1, a: 0.32, phase: 4.1 },
];
// Each row gets its own phase jitter so crests don't line up into long
// diagonal streaks across rows.
function rowJitter(row) {
    const s = Math.sin(row * 127.1 + 311.7) * 43758.5453;
    return (s - Math.floor(s) - 0.5) * 3;
}
function height(x, depth, t, jitter) {
    let h = 0;
    for (const wv of WAVES) h += Math.sin(x * wv.k / (0.35 + depth * 0.65) + t * wv.w + wv.phase + jitter * wv.a) * wv.a;
    return h;   // roughly -2..2
}

// ─── Gulls ───────────────────────────────────────────────────────────────────
let gull = null, untilGull = rand(8, 18);

// ─── Frame ───────────────────────────────────────────────────────────────────
let t = 0, lastTs = 0;
const RAMP = ['.', '-', '~', '=', '≈'];

function frame(ts) {
    requestAnimationFrame(frame);
    if (window.innerWidth !== W || window.innerHeight !== H) resize();
    if (W === 0 || H === 0) return;
    if (lastTs && ts - lastTs < 40) return;   // ~24 fps: the swell moves slowly
    const dt = Math.min(0.1, lastTs ? (ts - lastTs) / 1000 : 0);
    lastTs = ts;
    t += dt * P_SPEED;

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, W, H);   // the backdrop shows through

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Stars (not under the sun).
    if (!PAL.sun) {
        ctx.font = `${FS * 0.8}px "JetBrains Mono", monospace`;
        const mx = sunX(), my = horizon - H * 0.13, mr = Math.min(W, H) * 0.06 * 1.4;
        for (const s of stars) {
            if (Math.hypot(s.x - mx, s.y - my) < mr) continue;   // not over the moon
            const a = s.b * (0.5 + 0.5 * Math.sin(t * s.s + s.p)) * (1 - s.y / horizon);
            ctx.fillStyle = rgb([230, 235, 255], a * 0.8);
            ctx.fillText(a > 0.55 ? '*' : '.', s.x, s.y);
        }
    }

    const lx = sunX();
    // Clouds drifting across.
    ctx.font = `${FS}px "JetBrains Mono", monospace`;
    for (let i = 0; i < clouds.length; i++) {
        const c = clouds[i];
        c.x += c.v * dt * P_SPEED;
        if (c.x > W + 20) clouds[i] = newCloud(false);
        for (let j = 0; j < c.len; j++) {
            const thick = c.shape[j];
            ctx.fillStyle = rgb(mix(PAL.skyLow, [255, 255, 255], 0.35), 0.25 + thick * 0.3);
            ctx.fillText(thick > 0.7 ? '@' : thick > 0.4 ? 'o' : '~', c.x + j * CW, c.y);
            if (thick > 0.55) ctx.fillText('~', c.x + j * CW, c.y - FS * 0.8);
        }
    }

    // Gulls: a pair of flapping 'v's crossing the sky now and then.
    ctx.globalAlpha = 1;
    untilGull -= dt;
    if (!gull && untilGull <= 0) gull = { x: -40, y: rand(0.2, 0.6) * horizon, v: rand(40, 70) };
    if (gull) {
        gull.x += gull.v * dt;
        const flap = Math.sin(t * 9) > 0 ? 'v' : '-';
        ctx.fillStyle = rgb([230, 230, 240], 0.8);
        ctx.fillText(flap, gull.x, gull.y + Math.sin(t * 2) * 6);
        ctx.fillText(flap, gull.x - 26, gull.y + 12 + Math.sin(t * 2 + 1) * 6);
        if (gull.x > W + 60) { gull = null; untilGull = rand(12, 25); }
    }

    // The sea: rows from the horizon toward the viewer, growing with depth.
    ctx.globalCompositeOperation = 'lighter';
    let y = horizon + FS * 0.35;
    let row = 0;
    while (y < H + FS) {
        const depth = clamp((y - horizon) / (H - horizon), 0, 1);  // 0 far, 1 near
        const size = FS * (0.55 + depth * 0.75);
        const amp = size * 0.55 * P_TURB * (0.4 + depth);
        const step = Math.max(size * 0.75, 8.5);
        const dq = Math.round(depth * 12) / 12;
        const rowCol = mix(PAL.far, PAL.near, dq);
        const glintCol = mix(rowCol, PAL.light, 0.8);
        const drift = t * 40 * (0.3 + depth);   // nearer rows scroll faster
        const jitter = rowJitter(row);
        for (let x = (row % 2) * step * 0.5; x < W + step; x += step) {
            const h = height(x + drift, depth, t, jitter);
            const crest = h > 1.55 - P_TURB * 0.2 && Math.sin(x * 0.37 + row * 2.1 + t * 1.5) > 0.2;
            // Glitter path under the light.
            const glint = Math.exp(-Math.pow((x - lx) / (W * (0.03 + depth * 0.1)), 2));
            const shimmer = glint * (0.5 + 0.5 * Math.sin(x * 0.3 + t * 6 + row));
            let col = rowCol;
            let alpha = 0.18 + 0.35 * ((h + 2) / 4) + shimmer * 0.6;
            let ch = RAMP[clamp(Math.floor((h + 2) / 4 * RAMP.length), 0, RAMP.length - 1)];
            if (crest) { col = PAL.foam; ch = (Math.floor(x / step) + row) % 3 ? '^' : '*'; alpha = 0.7; }
            else if (shimmer > 0.55) { col = glintCol; ch = shimmer > 0.8 ? '*' : '+'; }
            const a = clamp(alpha, 0, 1) * (0.5 + depth * 0.5);
            // The painted sea already covers the faintest glyphs; skipping
            // them halves the draw count and leaves the troughs darker.
            if (a < 0.2) continue;
            const g = sprite(ch, size, col);
            ctx.globalAlpha = a;
            ctx.drawImage(g.c, x - g.w / 2, y - h * amp * 0.5 - g.h / 2, g.w, g.h);
        }
        y += size * (0.85 + depth * 0.45);
        row++;
    }
}

// ─── Start (synchronised across monitors when startAt is given) ─────────────
function start() {
    canvas.style.opacity = 1;
    backdrop.style.opacity = 1;
    requestAnimationFrame(frame);
}
if (START_AT > 0) setTimeout(start, Math.max(0, START_AT - Date.now()));
else setTimeout(start, DELAYED_START ? 1500 : 50);
</script>
</body>
</html>
