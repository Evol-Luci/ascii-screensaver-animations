<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Jellyfish Drift</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a12;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        body.screensaver-mode { cursor: none; }

        #jellyfish-canvas {
            display: block;
            opacity: 0;
            transition: opacity 2s ease-in;
        }

        .credits-popup {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background: rgba(10, 10, 18, 0.92);
            border: 1px solid rgba(60, 100, 130, 0.4);
            border-radius: 8px;
            padding: 20px 24px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 12px;
            color: #80b0c0;
            max-width: 280px;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            z-index: 100;
            line-height: 1.6;
        }
        .credits-popup.visible { opacity: 1; }
        .credits-popup h2 {
            font-size: 14px;
            font-weight: 700;
            color: #50c0d0;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .credits-popup .credits-label {
            font-size: 10px;
            color: #507080;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            margin-bottom: 4px;
        }
        .credits-popup hr {
            border: none;
            border-top: 1px solid rgba(60, 100, 130, 0.3);
            margin: 12px 0;
        }
        .credits-popup a { color: #4090a0; text-decoration: none; }
    </style>
</head>
<body>
<canvas id="jellyfish-canvas"></canvas>
<script>
// ─── Screensaver mode ──────────────────────────────────────────────────────────
const _params = new URLSearchParams(window.location.search);
const DELAYED_START    = _params.has('delayedStart');
const START_AT         = parseInt(_params.get('startAt') || '0', 10);

const P_SPEED            = parseFloat(_params.get('speed')          || '1');
const P_PALETTE          = _params.get('palette') || 'blue';
const P_JELLYFISH_COUNT  = parseInt(_params.get('jellyfishCount')   || '6', 10);
const P_GLOW_INTENSITY   = parseFloat(_params.get('glowIntensity')  || '1');
const P_DRIFT_CURRENTS   = parseFloat(_params.get('driftCurrents')  || '1');

// ─── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('jellyfish-canvas');
const ctx    = canvas.getContext('2d');

const FONT_SIZE = 16;
let CHAR_W = 9.6;
let CHAR_H = 20;
let cols = 0, rows = 0;

function measureFont() {
    ctx.font = `${FONT_SIZE}px 'JetBrains Mono', 'Courier New', monospace`;
    CHAR_W = ctx.measureText('M').width;
    CHAR_H = FONT_SIZE * 1.25;
}

function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    measureFont();
    cols = Math.floor(canvas.width  / CHAR_W);
    rows = Math.floor(canvas.height / CHAR_H);
    initPlankton();
    initJellies();
}

window.addEventListener('resize', resize);

// ─── Palettes ──────────────────────────────────────────────────────────────────
const JELLYFISH_PALETTES = {
    blue: {
        bellCore: 'rgba(140, 210, 255, 1)',
        bellMid:  'rgba(70, 150, 230, 0.6)',
        bellEdge: 'rgba(30, 90, 180, 0)',
        tentacle: 'rgba(110, 180, 240, 0.5)',
    },
    purple: {
        bellCore: 'rgba(210, 160, 255, 1)',
        bellMid:  'rgba(150, 90, 220, 0.6)',
        bellEdge: 'rgba(90, 40, 170, 0)',
        tentacle: 'rgba(180, 130, 235, 0.5)',
    },
    teal: {
        bellCore: 'rgba(140, 255, 230, 1)',
        bellMid:  'rgba(60, 200, 175, 0.6)',
        bellEdge: 'rgba(20, 120, 110, 0)',
        tentacle: 'rgba(100, 220, 195, 0.5)',
    },
    pink: {
        bellCore: 'rgba(255, 170, 210, 1)',
        bellMid:  'rgba(230, 90, 160, 0.6)',
        bellEdge: 'rgba(170, 40, 110, 0)',
        tentacle: 'rgba(240, 140, 190, 0.5)',
    },
    mono: {
        bellCore: 'rgba(235, 235, 235, 1)',
        bellMid:  'rgba(160, 160, 160, 0.6)',
        bellEdge: 'rgba(90, 90, 90, 0)',
        tentacle: 'rgba(190, 190, 190, 0.5)',
    },
};
const JP = JELLYFISH_PALETTES[P_PALETTE] || JELLYFISH_PALETTES.blue;

// ─── Deep-sea background ───────────────────────────────────────────────────────
function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0,   '#0a141c');
    grad.addColorStop(0.5, '#070d14');
    grad.addColorStop(1,   '#04070b');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// ─── Plankton sparkle ───────────────────────────────────────────────────────────
const PLANKTON_DENSITY = 0.00012;
let plankton = [];

function initPlankton() {
    const count = Math.round(canvas.width * canvas.height * PLANKTON_DENSITY);
    plankton = [];
    for (let i = 0; i < count; i++) {
        plankton.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            baseAlpha: 0.08 + Math.random() * 0.22,
            twinklePhase: Math.random() * Math.PI * 2,
            twinkleSpeed: 0.4 + Math.random() * 0.8,
        });
    }
}

function drawPlankton(t) {
    ctx.font = `${FONT_SIZE}px 'JetBrains Mono', 'Courier New', monospace`;
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#8fd8e0';
    for (const p of plankton) {
        const alpha = p.baseAlpha * (0.5 + 0.5 * Math.sin(t * 0.001 * p.twinkleSpeed + p.twinklePhase));
        if (alpha < 0.02) continue;
        ctx.globalAlpha = alpha;
        ctx.fillText('.', p.x, p.y);
    }
    ctx.globalAlpha = 1;
}

// ─── Jellyfish ─────────────────────────────────────────────────────────────────
function rndF(min, max) { return min + Math.random() * (max - min); }

// Cheap smooth 1D noise via interpolated hashed lattice points.
function hash1D(n) {
    const s = Math.sin(n * 127.1) * 43758.5453;
    return (s - Math.floor(s)) * 2 - 1;
}
function noise1D(x) {
    const i = Math.floor(x);
    const f = x - i;
    const a = hash1D(i);
    const b = hash1D(i + 1);
    const u = f * f * (3 - 2 * f);
    return a + (b - a) * u;
}

class Jellyfish {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.bellRadius   = rndF(28, 48);
        this.pulsePhase   = Math.random() * Math.PI * 2;
        this.pulseSpeed   = rndF(0.55, 0.85);
        this.driftPhase   = Math.random() * Math.PI * 2;
        this.vx = rndF(-0.15, 0.15);
        this.vy = rndF(-0.05, 0.05);

        this.tentacleCount  = 3 + Math.floor(Math.random() * 3);
        this.tentacleLength = this.bellRadius * rndF(2.2, 3.4);
        this.tentacleSeeds  = [];
        for (let i = 0; i < this.tentacleCount; i++) {
            this.tentacleSeeds.push({
                offsetX:    rndF(-0.7, 0.7),
                waveFreq:   rndF(1.4, 2.2),
                wavePhase:  Math.random() * Math.PI * 2,
                waveAmp:    rndF(3, 7),
            });
        }
        this.currentSeed = Math.random() * 1000;
    }

    pulseValue(t) {
        return (1 - Math.cos(this.pulsePhase + t * 0.001 * this.pulseSpeed * P_SPEED)) / 2;
    }

    update(t) {
        const current = noise1D(this.currentSeed + t * 0.00008 * P_SPEED) * P_DRIFT_CURRENTS;

        this.y += this.vy * P_SPEED;
        this.x += (this.vx + current * 0.4) * P_SPEED;

        const margin = this.bellRadius * 2;
        if (this.x < -margin) this.x = canvas.width + margin;
        if (this.x > canvas.width + margin) this.x = -margin;
        if (this.y < -margin) this.y = canvas.height + margin;
        if (this.y > canvas.height + margin) this.y = -margin;
    }

    drawBell(t) {
        const pulse  = this.pulseValue(t);
        const radius = this.bellRadius * (0.82 + 0.18 * (1 - pulse));
        const alpha  = (0.55 + 0.45 * pulse) * P_GLOW_INTENSITY;

        const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, radius);
        grad.addColorStop(0,   JP.bellCore);
        grad.addColorStop(0.45, JP.bellMid);
        grad.addColorStop(1,   JP.bellEdge);

        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, radius, radius * 0.72, 0, Math.PI, 0, false);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    drawTentacles(t) {
        const pulse = this.pulseValue(t);
        const baseY    = this.y + this.bellRadius * 0.6;
        const flick    = pulse * 4;
        const segments = 14;

        ctx.save();
        ctx.globalAlpha = (0.35 + 0.25 * pulse) * Math.min(1, P_GLOW_INTENSITY);
        ctx.strokeStyle = JP.tentacle;
        ctx.lineWidth = 1;

        for (const seed of this.tentacleSeeds) {
            const startX = this.x + seed.offsetX * this.bellRadius * 0.8;
            ctx.beginPath();
            ctx.moveTo(startX, baseY);
            for (let s = 1; s <= segments; s++) {
                const frac = s / segments;
                const py = baseY + frac * this.tentacleLength;
                const wave = Math.sin(frac * Math.PI * seed.waveFreq + seed.wavePhase + t * 0.0012 * P_SPEED)
                             * seed.waveAmp * (0.4 + 0.6 * frac) + flick * frac;
                const px = startX + wave;
                ctx.lineTo(px, py);
            }
            ctx.stroke();
        }
        ctx.restore();
    }
}

let jellies = [];
function initJellies() {
    jellies = [];
    for (let i = 0; i < P_JELLYFISH_COUNT; i++) jellies.push(new Jellyfish());
}

function drawJellies(t) {
    for (const j of jellies) j.drawTentacles(t);
    for (const j of jellies) j.drawBell(t);
}

// ─── Render / loop ─────────────────────────────────────────────────────────────
function render(t) {
    drawBackground();
    drawPlankton(t);
    drawJellies(t);
}

let raf;
function loop(t) {
    for (const j of jellies) j.update(t);
    render(t);
    raf = requestAnimationFrame(loop);
}

// ─── Entry point ───────────────────────────────────────────────────────────────
function startAnimation() {
    canvas.style.opacity = '1';
    document.fonts.ready.then(() => {
        resize();
        raf = requestAnimationFrame(loop);
    });
}

if (START_AT > 0) {
    const delay = Math.max(100, START_AT - Date.now());
    setTimeout(startAnimation, delay);
} else if (DELAYED_START) {
    setTimeout(startAnimation, 4000);
} else {
    setTimeout(startAnimation, 500);
}
</script>
</body>
</html>
