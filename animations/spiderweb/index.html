<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Spider Web</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #05060b;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #backdrop, #web-canvas {
            position: fixed;
            inset: 0;
            display: block;
            opacity: 0;
            transition: opacity 2.5s ease-in;
        }
    </style>
</head>
<body>
<canvas id="backdrop"></canvas>
<canvas id="web-canvas"></canvas>
<script>
// An orb weaver's night.
//
// Between the twigs of a garden shrub, a spider builds her web the way orb
// weavers do: bridge and frame threads first, then the radii out from the
// hub, then the sticky capture spiral laid from the outside in. The silk sags
// and sways in the air and beads with dew that catches the moonlight. Moths
// drawn to the moon blunder in; the web shivers, she runs out along the
// radii, wraps them and carries on. Wasps come hunting and she retreats to
// her curled-leaf hide; now and then a bird tears through — then she comes
// back out and mends the damage, thread by thread. Every so often she takes
// the old web down and spins a fresh one.

// ─── Parameters ──────────────────────────────────────────────────────────────
const _params       = new URLSearchParams(window.location.search);
const DELAYED_START = _params.has('delayedStart');
const START_AT      = parseInt(_params.get('startAt') || '0', 10);

function clamp(v, lo, hi) { return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : lo; }
const P_SPEED     = clamp(parseFloat(_params.get('speed') || '1'), 0.2, 4);
const P_PALETTE   = _params.get('palette') || 'moonlit';
const P_PACING    = _params.get('pacing') || 'medium';
const P_SWAY      = clamp(parseFloat(_params.get('webSway') || '1'), 0, 3);
const P_DEW       = clamp(parseFloat(_params.get('dewDensity') || '1'), 0, 3);
const P_PREY      = clamp(parseFloat(_params.get('preyRate') || '1'), 0, 3);
const P_PREDATOR  = clamp(parseFloat(_params.get('predatorRate') || '1'), 0, 3);
const P_MOON      = clamp(parseFloat(_params.get('moonGlow') || '1'), 0, 3);
// Seconds to build a whole web.
const BUILD_SECONDS = { brisk: 90, medium: 180, slow: 360, glacial: 720 }[P_PACING] || 180;

// ─── Helpers ─────────────────────────────────────────────────────────────────
function rand(a, b) { return a + Math.random() * (b - a); }
function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
function lerp(a, b, k) { return a + (b - a) * k; }
function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
function scale(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }
function smoothstep(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

// ─── Palettes ────────────────────────────────────────────────────────────────
const PALETTES = {
    moonlit: { sky: [[4, 6, 14], [18, 24, 44]], silk: [190, 205, 235], dew: [220, 235, 255], moon: [215, 225, 250], leaf: [30, 52, 40], twig: [60, 46, 38], spider: [150, 110, 70], mark: [240, 220, 160], prey: [200, 180, 150], fly: [230, 250, 150] },
    dawn:    { sky: [[40, 34, 66], [240, 160, 130]], silk: [255, 225, 215], dew: [255, 240, 225], moon: [255, 220, 190], leaf: [60, 70, 50], twig: [80, 56, 44], spider: [120, 70, 50], mark: [255, 230, 170], prey: [220, 190, 160], fly: [255, 230, 170] },
    amber:   { sky: [[14, 8, 4], [50, 30, 14]], silk: [230, 190, 120], dew: [255, 225, 160], moon: [255, 210, 130], leaf: [50, 44, 20], twig: [70, 44, 24], spider: [160, 90, 40], mark: [255, 220, 120], prey: [220, 180, 120], fly: [255, 220, 120] },
    frost:   { sky: [[4, 10, 18], [20, 40, 60]], silk: [200, 235, 250], dew: [235, 250, 255], moon: [215, 240, 255], leaf: [40, 60, 70], twig: [70, 76, 86], spider: [110, 120, 140], mark: [230, 245, 255], prey: [190, 210, 220], fly: [210, 255, 245] },
    mono:    { sky: [[6, 6, 8], [26, 26, 30]], silk: [200, 200, 200], dew: [240, 240, 240], moon: [225, 225, 225], leaf: [44, 44, 44], twig: [64, 64, 64], spider: [120, 120, 120], mark: [230, 230, 230], prey: [180, 180, 180], fly: [230, 230, 230] },
};
const PAL = PALETTES[P_PALETTE] || PALETTES.moonlit;
const FROST = P_PALETTE === 'frost';

// ─── Canvases ────────────────────────────────────────────────────────────────
const backdrop = document.getElementById('backdrop');
const bctx = backdrop.getContext('2d');
const canvas = document.getElementById('web-canvas');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, FS = 12, CW = 7.2, CH = 12;
let hub = { x: 0, y: 0 }, R = 100, moon = { x: 0, y: 0, r: 30 };
let anchors = [], retreat = { x: 0, y: 0 };

function resize() {
    W = window.innerWidth; H = window.innerHeight;
    for (const c of [backdrop, canvas]) {
        c.width = Math.max(1, W); c.height = Math.max(1, H);
        c.style.width = W + 'px'; c.style.height = H + 'px';
    }
    FS = clamp(Math.round(Math.min(W, H) / 60), 8, 18);
    CW = FS * 0.6; CH = FS * 1.05;
    hub = { x: W * 0.44, y: H * 0.52 };
    R = Math.min(W * 0.26, H * 0.33);
    moon = { x: W * 0.84, y: H * 0.16, r: Math.min(W, H) * 0.07 };
    // Anchor points on the twigs around the web.
    anchors = [
        { x: hub.x - R * 1.3, y: hub.y - R * 1.0 }, { x: hub.x + R * 0.15, y: hub.y - R * 1.25 },
        { x: hub.x + R * 1.25, y: hub.y - R * 0.45 }, { x: hub.x + R * 1.15, y: hub.y + R * 0.9 },
        { x: hub.x - R * 0.25, y: hub.y + R * 1.2 }, { x: hub.x - R * 1.35, y: hub.y + R * 0.35 },
    ];
    retreat = { x: anchors[1].x + CW * 3, y: anchors[1].y - CH * 0.5 };
    glyphCache.clear();
    newWeb(false);
    backdropDirty = true;
}

const glyphCache = new Map();
if (document.fonts) document.fonts.ready.then(() => { glyphCache.clear(); backdropDirty = true; });
function sprite(ch, col, size) {
    size = size || FS;
    const q = (v) => (clamp(v, 0, 255) >> 3) << 3;
    const r = q(col[0]), g = q(col[1]), b = q(col[2]);
    const key = ch + '|' + size + '|' + r + ',' + g + ',' + b;
    let s = glyphCache.get(key);
    if (!s) {
        if (glyphCache.size > 5000) glyphCache.clear();
        const w = Math.ceil(size * 0.62 * ch.length + size * 0.4) + 2, h = Math.ceil(size * 1.3) + 2;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const x = c.getContext('2d');
        x.font = `700 ${size}px "JetBrains Mono", monospace`;
        x.textAlign = 'center'; x.textBaseline = 'middle';
        x.fillStyle = `rgb(${r},${g},${b})`;
        x.fillText(ch, w / 2, h / 2);
        s = { c, w, h };
        glyphCache.set(key, s);
    }
    return s;
}
function stampOn(g, ch, x, y, col, alpha, size) {
    if (alpha <= 0.01) return;
    const s = sprite(ch, col, size);
    g.globalAlpha = Math.min(1, alpha);
    g.drawImage(s.c, x - s.w / 2, y - s.h / 2);
}
const stamp = (ch, x, y, col, alpha, size) => stampOn(ctx, ch, x, y, col, alpha, size);

// ─── The web: a graph of points and threads ──────────────────────────────────
// Points carry a rest position and a displacement (sway, ripples, tugs).
// Threads know their kind — bridge/frame, radius, spiral — whether they have
// been spun, and whether they are broken.
let pts = [], threads = [], queue = [], spiralPath = [];
const RADII = 24;   // divisible by 4: the spiral is queued in quarter-turns

function point(x, y, fixed = false) { pts.push({ x, y, dx: 0, dy: 0, vx: 0, vy: 0, fixed }); return pts.length - 1; }
function thread(a, b, kind) { threads.push({ a, b, kind, spun: false, broken: false }); return threads.length - 1; }

function newWeb(animate = true) {
    pts = []; threads = []; queue = [];
    const h = point(hub.x, hub.y);
    const A = anchors.map(a => point(a.x, a.y, true));
    // Frame: a polygon strung inside the anchors, tied to each.
    const frame = anchors.map((a, i) => point(lerp(hub.x, a.x, 0.72) + rand(-0.03, 0.03) * R, lerp(hub.y, a.y, 0.72) + rand(-0.03, 0.03) * R));
    frame.forEach((f, i) => { queue.push(thread(A[i], f, 'frame')); });
    frame.forEach((f, i) => { queue.push(thread(f, frame[(i + 1) % frame.length], 'frame')); });
    // Radii: from the hub to the frame polygon.
    const radEnds = [];
    const radMid = [];
    for (let k = 0; k < RADII; k++) {
        const ang = (k / RADII) * Math.PI * 2 + rand(-0.03, 0.03);
        const dir = [Math.cos(ang), Math.sin(ang)];
        // Intersect the ray with the frame polygon.
        let best = Infinity;
        for (let i = 0; i < frame.length; i++) {
            const p = pts[frame[i]], q = pts[frame[(i + 1) % frame.length]];
            const ex = q.x - p.x, ey = q.y - p.y;
            const den = dir[0] * ey - dir[1] * ex;
            if (Math.abs(den) < 1e-6) continue;
            const t = ((p.x - hub.x) * ey - (p.y - hub.y) * ex) / den;
            const u = ((p.x - hub.x) * dir[1] - (p.y - hub.y) * dir[0]) / den;
            if (t > 0 && u >= 0 && u <= 1) best = Math.min(best, t);
        }
        radEnds.push({ ang, len: Number.isFinite(best) ? best : R });
    }
    // Points along each radius where the spiral will cross it.
    const TURNS = 11;
    const inner = R * 0.14;
    const radPts = radEnds.map(() => []);
    spiralPath = [];
    const steps = TURNS * RADII;
    for (let s = 0; s <= steps; s++) {
        const k = s % RADII;
        const frac = s / steps;                                   // 0 outside → 1 inside
        const r = lerp(radEnds[k].len * 0.93, inner, frac);
        const idx = point(hub.x + Math.cos(radEnds[k].ang) * r, hub.y + Math.sin(radEnds[k].ang) * r);
        radPts[k].push({ idx, r });
        spiralPath.push(idx);
    }
    for (let k = 0; k < RADII; k++) {
        const end = point(hub.x + Math.cos(radEnds[k].ang) * radEnds[k].len, hub.y + Math.sin(radEnds[k].ang) * radEnds[k].len);
        const chain = [h, ...radPts[k].sort((a, b) => a.r - b.r).map(p => p.idx), end];
        // One queue entry per radius: spun hub → rim in one trip.
        const ids = [];
        for (let i = 1; i < chain.length; i++) ids.push(thread(chain[i - 1], chain[i], 'radius'));
        queue.push({ group: ids });
    }
    // Spiral, laid from the outside in, in runs of a quarter-turn.
    let run = [];
    for (let i = 1; i < spiralPath.length; i++) {
        run.push(thread(spiralPath[i - 1], spiralPath[i], 'spiral'));
        if (run.length >= Math.round(RADII / 4)) { queue.push({ group: run }); run = []; }
    }
    if (run.length) queue.push({ group: run });
    queue = queue.map(q => typeof q === 'number' ? { group: [q] } : q);
    web.total = queue.length;
    web.done = 0;
    web.hubIdx = h;
    web.frameIdx = frame;
    if (!animate) {   // start with a finished web
        for (const t of threads) t.spun = true;
        queue = [];
        web.done = web.total;
    }
    seedDew();
}
const web = { total: 1, done: 0, hubIdx: 0, frameIdx: [], age: 0 };
const P = (i) => { const p = pts[i]; return { x: p.x + p.dx, y: p.y + p.dy }; };

// ─── Air: wind, ripples, tugs ────────────────────────────────────────────────
let wind = 0, windT = 0, untilGust = rand(4, 10);
function updateAir(dt, t) {
    untilGust -= dt;
    if (untilGust <= 0) { windT = rand(-1, 1); untilGust = rand(5, 12); }
    windT *= Math.exp(-dt * 0.3);
    wind += (windT - wind) * Math.min(1, dt * 1.5);
    // Each point springs back toward rest; wind bellies the web out and it
    // sags a little under its own weight.
    for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        if (p.fixed) continue;
        const d = Math.hypot(p.x - hub.x, p.y - hub.y) / R;
        const belly = (1 - d * 0.6) * P_SWAY;
        const tx = wind * belly * CW * 3 + Math.sin(t * 1.3 + p.y * 0.01) * CW * 0.3 * P_SWAY;
        const ty = belly * CH * 0.6 + Math.cos(t * 1.1 + p.x * 0.01) * CH * 0.2 * P_SWAY;
        p.vx += ((tx - p.dx) * 14 - p.vx * 3) * dt;
        p.vy += ((ty - p.dy) * 14 - p.vy * 3) * dt;
        p.dx += p.vx * dt; p.dy += p.vy * dt;
    }
}
function pluck(x, y, strength) {
    // A struggling insect shakes the web around it.
    for (const p of pts) {
        if (p.fixed) continue;
        const d = Math.hypot(p.x - x, p.y - y);
        if (d < R * 0.4) { const k = (1 - d / (R * 0.4)) * strength; p.vx += rand(-1, 1) * k; p.vy += rand(-1, 1) * k; }
    }
}

// ─── Dew ─────────────────────────────────────────────────────────────────────
let dew = [];
function seedDew() {
    dew = [];
    const n = Math.floor(threads.length * 0.35 * P_DEW);
    for (let i = 0; i < n; i++) dew.push({ t: Math.floor(Math.random() * threads.length), u: Math.random(), s: rand(0.6, 1), p: rand(0, 6) });
}

// ─── The spider ──────────────────────────────────────────────────────────────
const spider = { x: 0, y: 0, state: 'build', target: null, path: [], t: 0, heading: 0, legs: 0, carry: 0 };

function goTo(x, y, speed, dt) {
    const dx = x - spider.x, dy = y - spider.y, d = Math.hypot(dx, dy);
    if (d < 2) { spider.x = x; spider.y = y; return true; }
    const step = Math.min(d, speed * dt);
    spider.x += dx / d * step; spider.y += dy / d * step;
    spider.heading = Math.atan2(dy, dx);
    spider.legs += step / (CW * 0.8);
    return false;
}

let buildAcc = 0;
function updateSpider(dt, t) {
    const fast = R * 1.4, slow = R * 0.5;
    if (predator && predator.state !== 'gone') {
        spider.state = 'hide';
        goTo(retreat.x, retreat.y, fast * 1.4, dt);
        return;
    }
    if (spider.state === 'hide') spider.state = 'idle';

    // Prey stuck in the web comes first.
    const stuck = prey.find(p => p.state === 'stuck');
    if (stuck && spider.state !== 'wrap') {
        spider.state = 'rush';
        if (goTo(stuck.x, stuck.y, fast, dt)) { spider.state = 'wrap'; spider.t = 0; spider.target = stuck; }
        return;
    }
    if (spider.state === 'wrap') {
        spider.t += dt;
        pluck(spider.x, spider.y, 20);
        if (spider.t > 2.2) {
            const p = spider.target;
            p.state = 'wrapped';
            bundles.push({ x: p.x, y: p.y, pt: nearestPoint(p.x, p.y), age: 0 });
            if (bundles.length > 8) bundles.shift();
            spider.state = 'idle';
        }
        return;
    }

    // Building or mending: take the next queued job at the web's pace.
    const perJob = BUILD_SECONDS / Math.max(1, web.total);
    buildAcc += dt;
    if (!spider.job && queue.length && buildAcc >= perJob * 0.5) {
        spider.job = queue.shift();
        spider.jobStep = 0;
        spider.state = 'build';
    }
    if (spider.job) {
        const g = spider.job.group;
        const th = threads[g[spider.jobStep]];
        // Walk to the start of the thread, then along it, spinning as she goes.
        const a = P(th.a), b = P(th.b);
        if (!spider.onThread) { if (goTo(a.x, a.y, fast, dt)) spider.onThread = true; }
        else if (goTo(b.x, b.y, slow + R * 0.3, dt)) {
            th.spun = true; th.broken = false;
            spider.onThread = false;
            spider.jobStep++;
            if (spider.jobStep >= g.length) { spider.job = null; web.done++; buildAcc = 0; }
        }
        return;
    }
    // Finished: wait at the hub, head down, legs on the radii.
    spider.state = 'idle';
    const h = P(web.hubIdx);
    goTo(h.x, h.y, slow, dt);
    web.age += dt;
    // Orb weavers take their webs down and rebuild most nights.
    if (web.age > BUILD_SECONDS * 1.6 && !prey.some(p => p.state === 'stuck')) { web.age = 0; tearDown(); }
}

function tearDown() {
    // Take in the old web (strands vanish around her), then begin again.
    for (const t of threads) t.spun = false;
    bundles.length = 0;
    newWeb(true);
    for (const t of threads) t.spun = false;
}

function nearestPoint(x, y) {
    let best = 0, bd = Infinity;
    for (let i = 0; i < pts.length; i++) { const p = P(i), d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < bd) { bd = d; best = i; } }
    return best;
}

// ─── Prey ────────────────────────────────────────────────────────────────────
const prey = [];
const bundles = [];
let untilPrey = rand(6, 12);
const KINDS = { moth: { ch: ['}{', ')('], size: 1.3, strength: 1.4 }, fly: { ch: ['x', '+'], size: 1, strength: 0.8 }, gnat: { ch: ['.', ','], size: 0.8, strength: 0.4 } };

function spiralSpunNear(x, y) {
    // Only a finished stretch of capture spiral holds prey.
    for (const th of threads) {
        if (th.kind !== 'spiral' || !th.spun || th.broken) continue;
        const a = P(th.a), b = P(th.b);
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        if ((mx - x) ** 2 + (my - y) ** 2 < (CW * 2.5) ** 2) return true;
    }
    return false;
}

function updatePrey(dt, t) {
    untilPrey -= dt * P_PREY;
    if (untilPrey <= 0) {
        untilPrey = rand(8, 20);
        const kind = pick(['moth', 'moth', 'fly', 'gnat']);
        const fromLeft = Math.random() < 0.5;
        prey.push({ kind, x: fromLeft ? -20 : W + 20, y: rand(0.15, 0.85) * H, state: 'fly', t: 0, seed: rand(0, 6), escapeAt: rand(4, 9) });
    }
    for (let i = prey.length - 1; i >= 0; i--) {
        const p = prey[i];
        p.t += dt;
        if (p.state === 'fly') {
            // Moths are drawn toward the moon; everything wanders.
            const tx = p.kind === 'moth' ? moon.x : hub.x + Math.sin(p.seed) * R;
            const ty = p.kind === 'moth' ? moon.y : hub.y + Math.cos(p.seed) * R * 0.5;
            const a = Math.atan2(ty - p.y, tx - p.x) + Math.sin(p.t * 3 + p.seed) * 1.2;
            const sp = W * (p.kind === 'gnat' ? 0.04 : 0.07);
            p.x += Math.cos(a) * sp * dt; p.y += Math.sin(a) * sp * dt;
            if (spiralSpunNear(p.x, p.y)) { p.state = 'stuck'; p.t = 0; p.pt = nearestPoint(p.x, p.y); }
            if (Math.hypot(p.x - moon.x, p.y - moon.y) < moon.r || p.t > 40) prey.splice(i, 1);
        } else if (p.state === 'stuck') {
            const q = P(p.pt);
            p.x = q.x; p.y = q.y;
            pluck(p.x, p.y, 40 * KINDS[p.kind].strength);
            // Big prey sometimes tears free before she arrives.
            if (p.kind === 'moth' && p.t > p.escapeAt && spider.state !== 'wrap') {
                breakAround(p.x, p.y, 3);
                p.state = 'fly'; p.t = 0; p.x += 20;
            }
        } else if (p.state === 'wrapped') prey.splice(i, 1);
    }
    for (const b of bundles) { b.age += dt; const q = P(b.pt); b.x = q.x; b.y = q.y; }
}

// Break the n spiral threads nearest a point, and queue them for mending.
function breakAround(x, y, n) {
    const cands = threads.map((th, i) => ({ th, i })).filter(o => o.th.spun && !o.th.broken && o.th.kind !== 'frame')
        .map(o => { const a = P(o.th.a), b = P(o.th.b); return { ...o, d: ((a.x + b.x) / 2 - x) ** 2 + ((a.y + b.y) / 2 - y) ** 2 }; })
        .sort((a, b) => a.d - b.d).slice(0, n);
    for (const c of cands) { c.th.broken = true; c.th.spun = false; strays.push({ i: c.i, t: 0 }); }
    if (cands.length) queue.unshift({ group: cands.map(c => c.i) });
}
const strays = [];   // broken ends drifting in the air for a moment

// ─── Predators: wasps and birds ──────────────────────────────────────────────
let predator = null, untilPredator = rand(50, 90);
function updatePredator(dt, t) {
    if (!predator) {
        untilPredator -= dt * P_PREDATOR;
        if (untilPredator <= 0 && web.done > web.total * 0.6) {
            untilPredator = rand(70, 140);
            predator = Math.random() < 0.65
                ? { kind: 'wasp', state: 'in', x: -30, y: rand(0.2, 0.7) * H, t: 0 }
                : { kind: 'bird', state: 'in', x: W + 40, y: hub.y + rand(-0.5, 0.5) * R, t: 0 };
        }
        return;
    }
    const p = predator;
    p.t += dt;
    if (p.kind === 'wasp') {
        // Hovers around the web looking for the spider, then gives up.
        if (p.state === 'in') {
            p.x += (hub.x + Math.sin(p.t * 1.5) * R * 0.6 - p.x) * dt * 1.5;
            p.y += (hub.y + Math.cos(p.t * 2.1) * R * 0.4 - p.y) * dt * 1.5;
            if (p.t > 9) p.state = 'out';
        } else {
            p.x += W * 0.25 * dt; p.y -= H * 0.05 * dt;
            if (p.x > W + 40) predator = null;
        }
    } else {
        // A bird flies straight through, tearing a band of the web.
        p.x -= W * 0.55 * dt;
        p.y += Math.sin(p.t * 3) * 2;
        if (!p.tore && Math.abs(p.x - hub.x) < R * 0.3) { p.tore = true; breakAround(p.x, p.y, 16); pluck(p.x, p.y, 200); }
        if (p.x < -60) predator = null;
    }
}

// ─── Backdrop: sky, moon, garden, twigs ──────────────────────────────────────
let backdropDirty = true;
function paintBackdrop() {
    const g = bctx;
    g.globalAlpha = 1;
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, css(PAL.sky[0])); sky.addColorStop(1, css(PAL.sky[1]));
    g.fillStyle = sky;
    g.fillRect(0, 0, W, H);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `700 ${FS}px "JetBrains Mono", monospace`;
    // Stars.
    for (let i = 0; i < 120; i++) { g.fillStyle = css([220, 228, 255], 0.2 + hash(i * 3) * 0.5); g.fillText(hash(i * 5) < 0.2 ? '*' : '.', hash(i) * W, hash(i + 0.5) * H * 0.7); }
    // The moon, soft and big.
    const glow = g.createRadialGradient(moon.x, moon.y, 0, moon.x, moon.y, moon.r * 6 * P_MOON);
    glow.addColorStop(0, css(PAL.moon, 0.3 * P_MOON)); glow.addColorStop(1, css(PAL.moon, 0));
    g.fillStyle = glow;
    g.fillRect(0, 0, W, H);
    for (let y = -moon.r; y <= moon.r; y += CH * 0.9) {
        const half = Math.sqrt(Math.max(0, moon.r * moon.r - y * y));
        for (let x = -half; x <= half; x += CW) {
            const crater = hash(Math.round(x / CW) * 3 + Math.round(y / CH) * 7) < 0.15;
            g.fillStyle = css(scale(PAL.moon, crater ? 0.75 : 1), 0.9);
            g.fillText(crater ? 'o' : x > half * 0.5 ? ':' : '@', moon.x + x, moon.y + y);
        }
    }
    // Garden shapes in the dark: leaves and stems at the edges.
    for (let i = 0; i < 260; i++) {
        const side = hash(i * 1.3);
        const x = side < 0.5 ? hash(i * 2.7) * W * 0.18 : W - hash(i * 2.7) * W * 0.12;
        const y = H * 0.3 + hash(i * 4.1) * H * 0.75;
        g.fillStyle = css(scale(PAL.leaf, 0.6 + hash(i) * 0.6));
        g.fillText(pick2(i, ['&', '%', '@', '*', '"']), x, y);
    }
    for (let x = 0; x < W; x += CW) {
        const h = H * (0.05 + 0.04 * hash(Math.floor(x / (CW * 3))));
        for (let y = H - h; y < H; y += CH) { g.fillStyle = css(scale(PAL.leaf, 0.7)); g.fillText(hash(x + y) < 0.5 ? '"' : '|', x, y); }
    }
    // The twigs the web is strung between.
    g.strokeStyle = css(PAL.twig); g.lineCap = 'round';
    const twig = (x0, y0, x1, y1, w) => { g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo((x0 + x1) / 2 + (y1 - y0) * 0.1, (y0 + y1) / 2 - (x1 - x0) * 0.1, x1, y1); g.stroke(); };
    // One twig per anchor, reaching in from beyond the screen edge and
    // passing through the anchor, so every frame thread is tied to wood.
    anchors.forEach((a, i) => {
        const dx = a.x - hub.x, dy = a.y - hub.y, d = Math.hypot(dx, dy) || 1;
        const ux = dx / d, uy = dy / d, bend = [-0.35, 0.35, 0.45, 0.35, -0.35, 0.35][i];   // keeps twigs clear of the moon
        const ox = a.x + (ux + -uy * bend) * W * 0.6, oy = a.y + (uy + ux * bend) * W * 0.6;
        twig(ox, oy, a.x - ux * CW * 1.5, a.y - uy * CW * 1.5, i === 1 ? 5 : 3.5);
    });
    // Leaves on the twigs, and the curled-leaf retreat.
    for (let i = 0; i < 40; i++) {
        const a = anchors[i % anchors.length];
        const x = a.x + (hash(i * 3.3) - 0.5) * R * 0.5, y = a.y + (hash(i * 5.9) - 0.5) * R * 0.3;
        g.fillStyle = css(scale(PAL.leaf, 1.4 + hash(i) * 0.4));
        g.fillText(pick2(i, ['<', '>', '(', ')', '&']), x, y);
    }
    g.fillStyle = css(scale(PAL.leaf, 1.8));
    g.fillText('(@@)', retreat.x, retreat.y);
}
function pick2(i, list) { return list[Math.floor(hash(i) * list.length)]; }

// ─── Drawing ─────────────────────────────────────────────────────────────────
function drawWeb(t) {
    const g = ctx;
    g.lineCap = 'round';
    // Silk glints where it faces the moon.
    for (const th of threads) {
        if (!th.spun) continue;
        const a = P(th.a), b = P(th.b);
        const ang = Math.atan2(b.y - a.y, b.x - a.x);
        const toMoon = Math.atan2(moon.y - (a.y + b.y) / 2, moon.x - (a.x + b.x) / 2);
        const glint = Math.pow(Math.abs(Math.sin(ang - toMoon)), 6);
        const base = th.kind === 'spiral' ? 0.32 : th.kind === 'radius' ? 0.42 : 0.5;
        g.globalAlpha = Math.min(1, base + glint * 0.5 * P_MOON);
        g.strokeStyle = css(mix(PAL.silk, [255, 255, 255], glint * 0.5));
        g.lineWidth = th.kind === 'frame' ? 1.4 : 1;
        // A little sag in each thread.
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 + Math.hypot(b.x - a.x, b.y - a.y) * 0.04;
        g.beginPath(); g.moveTo(a.x, a.y); g.quadraticCurveTo(mx, my, b.x, b.y); g.stroke();
    }
    // The thread she is spinning right now.
    if (spider.job && spider.onThread) {
        const th = threads[spider.job.group[spider.jobStep]];
        const a = P(th.a);
        g.globalAlpha = 0.6; g.strokeStyle = css(PAL.silk); g.lineWidth = 1;
        g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(spider.x, spider.y); g.stroke();
    }
    // Loose ends from breaks, fluttering then gone.
    for (let i = strays.length - 1; i >= 0; i--) {
        const s = strays[i]; s.t += 1 / 30;
        const th = threads[s.i], a = P(th.a);
        g.globalAlpha = 0.5 * (1 - s.t / 3); g.strokeStyle = css(PAL.silk);
        g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(a.x + Math.sin(t * 4 + i) * CW * 2, a.y + CH * 2 * s.t); g.stroke();
        if (s.t > 3) strays.splice(i, 1);
    }
    // Dew beads (or frost crystals).
    for (const d of dew) {
        const th = threads[d.t];
        if (!th.spun) continue;
        const a = P(th.a), b = P(th.b);
        const x = lerp(a.x, b.x, d.u), y = lerp(a.y, b.y, d.u) + Math.sin(d.u * Math.PI) * Math.hypot(b.x - a.x, b.y - a.y) * 0.04;
        const tw = 0.6 + 0.4 * Math.sin(t * 2 + d.p);
        stamp(FROST ? '*' : d.s > 0.85 ? 'o' : '.', x, y, PAL.dew, tw * d.s, FROST ? FS : Math.round(FS * 0.9));
    }
}

function drawSpider(t) {
    // An orb weaver, drawn from the top: legs in four pairs that step as she
    // walks, a banded abdomen, and the cross on her back.
    const x = spider.x, y = spider.y;
    const walk = Math.sin(spider.legs * Math.PI);
    const col = PAL.spider, mark = PAL.mark;
    const s = Math.round(FS * 1.2), cw = s * 0.6, ch = s * 1.05;
    stampOn(ctx, walk > 0 ? '\\ /' : '| |', x, y - ch * 1.1, col, 1, s);
    stampOn(ctx, '-(o)-', x, y - ch * 0.4, col, 1, s);
    stampOn(ctx, '-(@)-', x, y + ch * 0.35, col, 1, s);
    stampOn(ctx, '+', x, y + ch * 0.35, mark, 0.9, s);
    stampOn(ctx, walk > 0 ? '/ \\' : '| |', x, y + ch * 1.1, col, 1, s);
    if (spider.state === 'wrap') stampOn(ctx, '@', x + cw * 1.8, y, PAL.silk, 0.6 + 0.4 * Math.sin(t * 20), s);
}

function draw(t) {
    const g = ctx;
    g.globalAlpha = 1;
    g.clearRect(0, 0, W, H);
    drawWeb(t);
    for (const b of bundles) stamp('0', b.x, b.y, mix(PAL.silk, [255, 255, 255], 0.4), 0.9);
    for (const p of prey) {
        const k = KINDS[p.kind];
        const flap = p.state === 'stuck' ? Math.sin(t * 30) > 0 : Math.sin(t * 16 + p.seed) > 0;
        stamp(k.ch[flap ? 0 : 1], p.x, p.y, PAL.prey, 1, Math.round(FS * k.size));
    }
    if (predator) {
        const p = predator;
        if (p.kind === 'wasp') { stamp(Math.sin(t * 40) > 0 ? '>=<' : '>-<', p.x, p.y, [230, 200, 60], 1, Math.round(FS * 1.2)); stamp('!', p.x + CW * 2, p.y, [40, 30, 20], 1); }
        else stamp(Math.sin(p.t * 12) > 0 ? '\\v/' : '-v-', p.x, p.y, scale(PAL.sky[0], 0.5), 1, Math.round(FS * 2.2));
    }
    drawSpider(t);
    // Fireflies below.
    for (let i = 0; i < 16; i++) {
        const gl = Math.max(0, Math.sin(t * (0.6 + hash(i) * 0.8) + i * 2)) ** 6;
        if (gl < 0.05) continue;
        stamp(gl > 0.6 ? '*' : '.', hash(i * 3) * W, H * (0.65 + hash(i * 7) * 0.3) + Math.sin(t * 0.5 + i) * CH, PAL.fly, gl * 0.8);
    }
    g.globalAlpha = 1;
}

// ─── Main loop ───────────────────────────────────────────────────────────────
let clock = 0, lastTs = 0;
function frame(ts) {
    requestAnimationFrame(frame);
    if (window.innerWidth !== W || window.innerHeight !== H) resize();
    if (W === 0 || H === 0) return;
    if (lastTs && ts - lastTs < 33) return;   // ~30 fps
    const dt = Math.min(0.1, lastTs ? (ts - lastTs) / 1000 : 1 / 30) * P_SPEED;
    lastTs = ts;
    clock += dt;
    updateAir(dt, clock);
    updatePredator(dt, clock);
    updatePrey(dt, clock);
    updateSpider(dt, clock);
    if (backdropDirty) { paintBackdrop(); backdropDirty = false; }
    draw(clock);
}

function start() {
    backdrop.style.opacity = 1;
    canvas.style.opacity = 1;
    requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
resize();
// Begin with the frame and radii up and the spiral under way, so there is
// always something to see (testing hook: ?fresh starts from nothing).
spider.x = hub.x; spider.y = hub.y;
newWeb(true);
const head = _params.has('fresh') ? 0 : Math.floor(web.total * 0.45);
for (let k = 0; k < head; k++) { const job = queue.shift(); for (const i of job.group) threads[i].spun = true; web.done++; }

if (START_AT > 0) setTimeout(start, Math.max(100, START_AT - Date.now()));
else if (DELAYED_START) setTimeout(start, 4000);
else setTimeout(start, 500);
</script>
</body>
