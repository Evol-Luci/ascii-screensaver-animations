<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Aurora</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #020208;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        body.screensaver-mode { cursor: none; }

        #aurora-canvas {
            display: block;
            opacity: 0;
            transition: opacity 2s ease-in;
        }

        .credits-popup {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background: rgba(6, 10, 22, 0.92);
            border: 1px solid rgba(40, 180, 80, 0.35);
            border-radius: 8px;
            padding: 20px 24px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 12px;
            color: #60b870;
            max-width: 280px;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            z-index: 100;
            line-height: 1.6;
        }
        .credits-popup.visible { opacity: 1; }
        .credits-popup h2 {
            font-size: 14px;
            font-weight: 700;
            color: #40e070;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .credits-popup .credits-label {
            font-size: 10px;
            color: #2a7038;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            margin-bottom: 4px;
        }
        .credits-popup hr {
            border: none;
            border-top: 1px solid rgba(40, 180, 80, 0.25);
            margin: 12px 0;
        }
        .credits-popup a { color: #40c060; text-decoration: none; }
    </style>
</head>
<body>
<canvas id="aurora-canvas"></canvas>
<script>
const _params = new URLSearchParams(window.location.search);
const SCREENSAVER_MODE = _params.has('screensaver');
const DELAYED_START    = _params.has('delayedStart');
const START_AT         = parseInt(_params.get('startAt') || '0', 10);

const P_SPEED      = parseFloat(_params.get('speed')      || '1');
const P_PALETTE    = _params.get('palette') || 'aurora';
const P_BANDS      = parseInt(_params.get('bands')        || '3', 10);
const P_BRIGHTNESS = parseFloat(_params.get('brightness') || '1');
const P_STARS      = parseInt(_params.get('stars')        || '150', 10);

if (SCREENSAVER_MODE) {
    document.body.classList.add('screensaver-mode');

    const credits = document.createElement('div');
    credits.className = 'credits-popup';
    credits.innerHTML = `
        <h2>ASCII Aurora</h2>
        <p class="credits-label">Animation</p>
        <p>Procedural aurora borealis<br>rendered in ASCII.</p>
        <hr>
        <p class="credits-label">Screensaver Framework</p>
        <p>Developed by Luci Evol<br>under Evol Digital Productions.</p>
        <p style="margin-top:8px"><a href="https://www.evoldigitalproductions.com" tabindex="-1">www.evoldigitalproductions.com</a></p>
    `;
    document.body.appendChild(credits);
    setTimeout(() => credits.classList.add('visible'), 500);
    setTimeout(() => credits.classList.remove('visible'), 30500);
    setTimeout(() => credits.remove(), 32500);

    let armed = false;
    setTimeout(() => { armed = true; }, 1500);
    const dismiss = () => {
        if (!armed) return;
        try { window.close(); } catch(e) {}
        document.body.innerHTML = '';
        document.body.style.background = '#000';
    };
    window.addEventListener('keydown', dismiss);
    window.addEventListener('mousedown', dismiss);
    window.addEventListener('mousemove', (() => {
        let lastX = -1, lastY = -1, moveCount = 0;
        return (e) => {
            if (lastX === -1) { lastX = e.clientX; lastY = e.clientY; return; }
            if (e.clientX === lastX && e.clientY === lastY) return;
            lastX = e.clientX; lastY = e.clientY;
            if (++moveCount > 10) dismiss();
        };
    })());
}

const canvas = document.getElementById('aurora-canvas');
const ctx    = canvas.getContext('2d');

const FONT_SIZE = 16;
let CHAR_W = 9.6;
let CHAR_H = 20;
let cols = 0, rows = 0;

function measureFont() {
    ctx.font = `${FONT_SIZE}px 'JetBrains Mono', 'Courier New', monospace`;
    CHAR_W = ctx.measureText('M').width;
    CHAR_H = FONT_SIZE * 1.25;
}

function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    measureFont();
    cols = Math.floor(canvas.width  / CHAR_W);
    rows = Math.floor(canvas.height / CHAR_H);
}

window.addEventListener('resize', resize);

const PALETTES = {
    aurora: {
        bands: [
            ['#0a8030', '#18b050', '#50e080', '#90ffc0'],
            ['#10a060', '#20d080', '#60ffb0', '#b0ffd0'],
            ['#209060', '#40c080', '#80e0a0', '#c0f0d0'],
        ],
        reflection: ['#0a4020', '#105030', '#206040', '#408060'],
        skyTop: '#010104',
        skyBot: '#0a1020',
        starColor: '#7080a0',
    },
    northern: {
        bands: [
            ['#0a8030', '#20b050', '#60e080', '#a0ffc0'],
            ['#402080', '#6040c0', '#a070f0', '#d0b0ff'],
            ['#801060', '#b03090', '#e060c0', '#f0a0e0'],
        ],
        reflection: ['#201040', '#301860', '#402880', '#6040a0'],
        skyTop: '#020108',
        skyBot: '#0a0620',
        starColor: '#7060a0',
    },
    southern: {
        bands: [
            ['#a02010', '#c04020', '#e07040', '#ffa080'],
            ['#c06010', '#e08020', '#f0a040', '#ffc080'],
            ['#a03040', '#c05060', '#e08090', '#f0b0c0'],
        ],
        reflection: ['#501008', '#702010', '#803020', '#a05040'],
        skyTop: '#040204',
        skyBot: '#140810',
        starColor: '#907070',
    },
    neon: {
        bands: [
            ['#008080', '#00b0b0', '#40e0e0', '#90ffff'],
            ['#800080', '#c000c0', '#f040f0', '#f0a0f0'],
            ['#008040', '#00b060', '#40e090', '#90ffc0'],
        ],
        reflection: ['#004040', '#006060', '#008080', '#40a0a0'],
        skyTop: '#020108',
        skyBot: '#080420',
        starColor: '#6070a0',
    },
    mono: {
        bands: [
            ['#282828', '#404040', '#707070', '#a0a0a0'],
            ['#202020', '#383838', '#606060', '#909090'],
            ['#303030', '#484848', '#808080', '#b0b0b0'],
        ],
        reflection: ['#101010', '#181818', '#282828', '#404040'],
        skyTop: '#010101',
        skyBot: '#080808',
        starColor: '#505050',
    },
};

const PAL = PALETTES[P_PALETTE] || PALETTES.aurora;

const DENSITY_CHARS = ['@', '#', '8', 'O', 'o', '+', ':', '.', '`', ' '];
const STREAK_CHARS = ['─', '═', '━'];
const SHIMMER_CHARS = ['│', '┃', '║', '|', '¦'];

const LANDSCAPE = [
    '                                            ',
    '           ~~                               ',
    '     ~~~~~     ~~~~                         ',
    '   ~~~~~~~   ~~~~~~~~~    ~                 ',
    '  ~~~~~~~~~ ~~~~~~~~~~~~ ~~~~  ~            ',
    ' ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~  ~~~~~~',
    '~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~',
    '~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~',
];

let stars = [];
function initStars() {
    stars = [];
    const landH = LANDSCAPE.length;
    const skyRows = rows - landH;
    for (let i = 0; i < P_STARS; i++) {
        const gy = Math.floor(Math.random() * skyRows * 0.7);
        const starDensity = 1 - (gy / (skyRows * 0.7)) * 0.4;
        if (Math.random() > starDensity) continue;
        stars.push({
            gx: Math.floor(Math.random() * cols),
            gy: gy,
            char: Math.random() < 0.15 ? '*' : '.',
            base: 0.15 + Math.random() * 0.5,
            twinkle: Math.random() * Math.PI * 2,
            speed: 0.2 + Math.random() * 1.2,
        });
    }
}

/* ── Shooting Stars ── */
let shootingStars = [];
function maybeSpawnShootingStar() {
    if (Math.random() > 0.003) return;
    const landH = LANDSCAPE.length;
    const skyRows = rows - landH;
    shootingStars.push({
        x: Math.random() * cols * 0.8,
        y: Math.random() * skyRows * 0.4,
        vx: 2.5 + Math.random() * 3,
        vy: 0.8 + Math.random() * 1.5,
        life: 12 + Math.floor(Math.random() * 18),
        age: 0,
        trail: [],
    });
}

function updateShootingStars() {
    for (const ss of shootingStars) {
        ss.trail.push({ x: ss.x, y: ss.y });
        if (ss.trail.length > 6) ss.trail.shift();
        ss.x += ss.vx;
        ss.y += ss.vy;
        ss.age++;
    }
    shootingStars = shootingStars.filter(ss => ss.age < ss.life);
}

function drawShootingStars() {
    for (const ss of shootingStars) {
        const fade = 1 - ss.age / ss.life;
        for (let i = 0; i < ss.trail.length; i++) {
            const tp = ss.trail[i];
            const trailFade = (i / ss.trail.length) * fade;
            ctx.globalAlpha = trailFade * 0.9;
            ctx.fillStyle = '#ffffffcc';
            ctx.fillText('─', tp.x * CHAR_W, tp.y * CHAR_H);
        }
        ctx.globalAlpha = fade;
        ctx.fillStyle = '#ffffff';
        ctx.fillText('*', ss.x * CHAR_W, ss.y * CHAR_H);
    }
}

/* ── Aurora Band ── */
class AuroraBand {
    constructor(index, total) {
        this.index = index;
        this.phase = Math.random() * Math.PI * 2;
        this.freq1 = 0.006 + Math.random() * 0.006;
        this.freq2 = 0.003 + Math.random() * 0.004;
        this.freq3 = 0.012 + Math.random() * 0.008;
        this.amp1 = 0.07 + Math.random() * 0.05;
        this.amp2 = 0.03 + Math.random() * 0.04;
        this.amp3 = 0.02 + Math.random() * 0.03;
        this.speed1 = 0.2 + Math.random() * 0.2;
        this.speed2 = 0.1 + Math.random() * 0.15;
        this.speed3 = 0.3 + Math.random() * 0.2;
        this.baseY = 0.06 + (index / Math.max(1, total - 1)) * 0.15;
        this.height = 0.20 + Math.random() * 0.08;
        this.bandColors = PAL.bands[index % PAL.bands.length];
        this.reflectColors = PAL.reflection;
        this.colorShift = Math.random() * Math.PI * 2;
        this.thicknessBob = Math.random() * Math.PI * 2;
        // Shimmer ray parameters
        this.shimmerCount = 5 + Math.floor(Math.random() * 4);
        this.shimmerSeeds = [];
        for (let i = 0; i < this.shimmerCount; i++) {
            this.shimmerSeeds.push({
                freq: 0.01 + Math.random() * 0.02,
                speed: 0.3 + Math.random() * 0.5,
                phase: Math.random() * Math.PI * 2,
                width: 1 + Math.random() * 2,
            });
        }
    }

    getOffset(gx, t) {
        const wt = t * P_SPEED;
        return (
            this.amp1 * Math.sin(this.freq1 * gx + this.speed1 * wt + this.phase) +
            this.amp2 * Math.sin(this.freq2 * gx * 0.5 + this.speed2 * wt * 0.7 + this.phase * 1.3) +
            this.amp3 * Math.sin(this.freq3 * gx * 1.7 - this.speed3 * wt * 1.2 + 1.5) +
            this.amp1 * 0.4 * Math.sin(this.freq1 * 3.1 * gx + this.speed1 * 0.4 * wt + 2.7)
        );
    }

    // Store band peak info for bloom & reflection
    draw(t, canvasW, canvasH) {
        const shimmer = 0.12 * Math.sin(t * P_SPEED * 0.9 + this.phase * 2);
        const colorCycle = 0.5 + 0.5 * Math.sin(t * P_SPEED * 0.15 + this.colorShift);
        const thicknessMod = 1 + 0.15 * Math.sin(t * P_SPEED * 0.1 + this.thicknessBob);
        const bandH = Math.floor(this.height * rows * thicknessMod);

        this._peakPositions = [];

        for (let gx = 0; gx < cols; gx++) {
            const offset = this.getOffset(gx, t);
            const baseRow = Math.floor((this.baseY + offset) * rows);
            const colors = this.bandColors;

            // Compute shimmer ray intensity at this column
            let rayIntensity = 0;
            for (const seed of this.shimmerSeeds) {
                const rayPos = Math.sin(seed.freq * gx + seed.speed * t * P_SPEED + seed.phase);
                if (rayPos > 0.85) {
                    rayIntensity = Math.max(rayIntensity, (rayPos - 0.85) / 0.15);
                }
            }

            for (let dy = 0; dy < bandH; dy++) {
                const gy = baseRow + dy;
                if (gy < 0 || gy >= rows) continue;

                const progress = dy / bandH;
                const envelope = Math.pow(1 - progress, 1.8);
                let alpha = envelope * P_BRIGHTNESS * (0.8 + shimmer);

                // Shimmer rays boost alpha and use vertical chars
                const isRay = rayIntensity > 0.1 && progress < 0.85;
                if (isRay) {
                    alpha = Math.min(1, alpha + rayIntensity * 0.35 * envelope);
                }

                if (alpha < 0.02) continue;

                const ci = Math.min(colors.length - 1, Math.floor(progress * colors.length));
                const ciNext = Math.min(colors.length - 1, ci + 1);
                const frac = (progress * colors.length) - ci;

                const c1 = colors[ci];
                const c2 = colors[ciNext];
                let r = Math.round((parseInt(c1.slice(1,3),16) * (1-frac) + parseInt(c2.slice(1,3),16) * frac));
                let g = Math.round((parseInt(c1.slice(3,5),16) * (1-frac) + parseInt(c2.slice(3,5),16) * frac));
                let b = Math.round((parseInt(c1.slice(5,7),16) * (1-frac) + parseInt(c2.slice(5,7),16) * frac));

                // Brighten shimmer rays
                if (isRay) {
                    const boost = rayIntensity * 0.5;
                    r = Math.min(255, Math.round(r + (255 - r) * boost));
                    g = Math.min(255, Math.round(g + (255 - g) * boost));
                    b = Math.min(255, Math.round(b + (255 - b) * boost));
                }

                const charIdx = Math.min(DENSITY_CHARS.length - 1, Math.floor(Math.pow(1 - envelope * (0.7 + 0.3 * colorCycle), 0.8) * (DENSITY_CHARS.length - 1)));
                const ch = (isRay && rayIntensity > 0.4 && progress < 0.6)
                    ? SHIMMER_CHARS[Math.floor(Math.random() * SHIMMER_CHARS.length)]
                    : DENSITY_CHARS[charIdx];

                ctx.globalAlpha = Math.min(1, alpha);
                ctx.fillStyle = `rgb(${r},${g},${b})`;
                ctx.fillText(ch, gx * CHAR_W, gy * CHAR_H);
            }

            // Store peak position for bloom/reflection
            if (baseRow >= 0 && baseRow < rows) {
                this._peakPositions.push({ gx, baseRow, offset });
            }
        }

        // Horizontal streaks at band leading edge
        for (let gx = 0; gx < cols; gx++) {
            const offset = this.getOffset(gx, t);
            const baseRow = Math.floor((this.baseY + offset) * rows);
            if (baseRow < 0 || baseRow >= rows) continue;

            const colors = this.bandColors;
            const progress = 0.15;
            const ci = Math.min(colors.length - 1, Math.floor(progress * colors.length));
            const c1 = colors[ci];
            const r = Math.round(parseInt(c1.slice(1,3),16));
            const g = Math.round(parseInt(c1.slice(3,5),16));
            const b = Math.round(parseInt(c1.slice(5,7),16));

            const peakAlpha = P_BRIGHTNESS * (0.8 + shimmer);
            const streakCount = Math.floor(P_BRIGHTNESS * (1 + 2 * shimmer));
            for (let s = 0; s < streakCount; s++) {
                const sx = gx * CHAR_W + (Math.random() - 0.5) * CHAR_W * 0.9;
                ctx.globalAlpha = peakAlpha * 0.5 * (0.3 + 0.7 * Math.random());
                ctx.fillStyle = `rgb(${Math.min(255,r+40)},${Math.min(255,g+40)},${Math.min(255,b+20)})`;
                ctx.fillText(STREAK_CHARS[s % STREAK_CHARS.length], sx, baseRow * CHAR_H);
            }
        }
    }

    // Additive bloom pass
    drawBloom(t) {
        if (!this._peakPositions || this._peakPositions.length === 0) return;
        const colors = this.bandColors;
        const c1 = colors[0];
        const r = parseInt(c1.slice(1,3),16);
        const g = parseInt(c1.slice(3,5),16);
        const b = parseInt(c1.slice(5,7),16);

        const prevComp = ctx.globalCompositeOperation;
        ctx.globalCompositeOperation = 'lighter';

        // Sample every few columns for glow spots
        for (let i = 0; i < this._peakPositions.length; i += 3) {
            const pp = this._peakPositions[i];
            const px = pp.gx * CHAR_W;
            const py = pp.baseRow * CHAR_H;
            const grad = ctx.createRadialGradient(px, py, 0, px, py, CHAR_H * 4);
            grad.addColorStop(0, `rgba(${r},${g},${b},${0.06 * P_BRIGHTNESS})`);
            grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
            ctx.fillStyle = grad;
            ctx.fillRect(px - CHAR_H * 4, py - CHAR_H * 4, CHAR_H * 8, CHAR_H * 8);
        }

        ctx.globalCompositeOperation = prevComp;
    }

    // Reflection on landscape
    drawReflection(t, landStartRow) {
        if (!this._peakPositions || this._peakPositions.length === 0) return;
        const colors = this.reflectColors;
        const shimmer = 0.1 * Math.sin(t * P_SPEED * 1.3 + this.phase * 3);

        for (let gx = 0; gx < cols; gx += 2) {
            const offset = this.getOffset(gx, t);
            const baseRow = Math.floor((this.baseY + offset) * rows);
            const dist = landStartRow - baseRow;
            if (dist <= 0) continue;
            const intensity = Math.max(0, 1 - dist / (rows * 0.5));
            if (intensity < 0.05) continue;

            const ci = Math.min(colors.length - 1, Math.floor(intensity * colors.length));
            const c = colors[ci];
            const r = parseInt(c.slice(1,3),16);
            const g = parseInt(c.slice(3,5),16);
            const b = parseInt(c.slice(5,7),16);

            for (let dy = 0; dy < 3; dy++) {
                const gy = landStartRow + dy;
                if (gy >= rows) break;
                const falloff = intensity * (1 - dy * 0.3) * (0.25 + shimmer);
                ctx.globalAlpha = Math.min(0.3, falloff * P_BRIGHTNESS);
                ctx.fillStyle = `rgb(${r},${g},${b})`;
                ctx.fillText('~', gx * CHAR_W, gy * CHAR_H);
            }
        }
    }
}

function drawLandscape() {
    const landH = LANDSCAPE.length;
    const startRow = rows - landH;
    if (startRow < 0) return;
    const repeats = Math.ceil(cols / LANDSCAPE[0].length);

    for (let dy = 0; dy < landH; dy++) {
        const gy = startRow + dy;
        if (gy >= rows) continue;
        const line = LANDSCAPE[dy];
        for (let rep = 0; rep < repeats; rep++) {
            const offset = rep * line.length;
            for (let dx = 0; dx < line.length; dx++) {
                const cx = offset + dx;
                if (cx >= cols) break;
                const ch = line[dx];
                if (ch === ' ') continue;
                const dark = Math.floor(4 + (dy / landH) * 10);
                ctx.globalAlpha = 0.4 + (dy / landH) * 0.5;
                ctx.fillStyle = `rgb(${dark},${Math.floor(dark * 0.6)},${Math.floor(dark * 0.7)})`;
                ctx.fillText(ch, cx * CHAR_W, gy * CHAR_H);
            }
        }
    }
    ctx.globalAlpha = 1;
}

let bands = [];
function initBands() {
    bands = [];
    const count = Math.max(1, Math.min(5, P_BANDS));
    for (let i = 0; i < count; i++) {
        bands.push(new AuroraBand(i, count));
    }
}

// Compute dominant band color for sky bleed
function getDominantColor(t) {
    const colors = PAL.bands[0];
    const c = colors[1];
    const r = parseInt(c.slice(1,3),16);
    const g = parseInt(c.slice(3,5),16);
    const b = parseInt(c.slice(5,7),16);
    const pulse = 0.3 + 0.15 * Math.sin(t * P_SPEED * 0.08);
    return { r: Math.floor(r * pulse), g: Math.floor(g * pulse), b: Math.floor(b * pulse) };
}

let animTime = 0;

function render(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Sky gradient with aurora color bleed
    const dom = getDominantColor(animTime);
    const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGrad.addColorStop(0, PAL.skyTop);
    skyGrad.addColorStop(0.25, `rgb(${Math.floor(dom.r*0.15)},${Math.floor(dom.g*0.15)},${Math.floor(dom.b*0.15)+8})`);
    skyGrad.addColorStop(0.6, PAL.skyBot);
    skyGrad.addColorStop(0.85, '#0a0f18');
    skyGrad.addColorStop(1, '#05080c');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = `${FONT_SIZE}px 'JetBrains Mono', 'Courier New', monospace`;
    ctx.textBaseline = 'top';

    for (const s of stars) {
        const sx = s.gx * CHAR_W;
        const sy = s.gy * CHAR_H;
        const a = s.base * (0.5 + 0.5 * Math.sin(t * s.speed * 0.0008 + s.twinkle));
        const pulse = 0.8 + 0.2 * Math.sin(t * 0.0003 + s.twinkle * 0.5);
        ctx.globalAlpha = a * 0.7 * pulse;
        ctx.fillStyle = PAL.starColor;
        ctx.fillText(s.char, sx, sy);
    }

    // Shooting stars
    maybeSpawnShootingStar();
    updateShootingStars();
    drawShootingStars();

    // Draw aurora bands
    for (const band of bands) {
        band.draw(animTime, canvas.width, canvas.height);
    }

    // Additive bloom pass
    for (const band of bands) {
        band.drawBloom(animTime);
    }

    drawLandscape();

    // Reflection pass on landscape
    const landStartRow = rows - LANDSCAPE.length;
    if (landStartRow > 0) {
        for (const band of bands) {
            band.drawReflection(animTime, landStartRow);
        }
    }

    ctx.globalAlpha = 1;
}

let raf;
function loop(t) {
    animTime += 0.016 * P_SPEED;
    render(t);
    raf = requestAnimationFrame(loop);
}

function startAnimation() {
    canvas.style.opacity = '1';
    document.fonts.ready.then(() => {
        resize();
        initStars();
        initBands();
        raf = requestAnimationFrame(loop);
    });
}

if (START_AT > 0) {
    const delay = Math.max(100, START_AT - Date.now());
    setTimeout(startAnimation, delay);
} else if (DELAYED_START) {
    setTimeout(startAnimation, 4000);
} else {
    setTimeout(startAnimation, 500);
}
</script>
</body>
</html>
