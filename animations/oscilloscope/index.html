<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII Oscilloscope</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a12; overflow: hidden; width: 100vw; height: 100vh; }
    body.screensaver-mode { cursor: none; }
    #scene { display: block; opacity: 0; transition: opacity 2s ease-in; }
    .credits-popup {
      position: fixed; bottom: 32px; right: 32px;
      background: rgba(10,10,18,0.92); border: 1px solid rgba(150,170,200,0.4);
      border-radius: 8px; padding: 20px 24px;
      font-family: 'JetBrains Mono','Courier New',monospace;
      font-size: 12px; color: #a8b8d0; max-width: 280px;
      opacity: 0; transition: opacity 2s ease-in-out; z-index: 100; line-height: 1.6;
    }
    .credits-popup.visible { opacity: 1; }
    .credits-popup h2 { font-size: 14px; font-weight: 700; color: #c8d8f0;
      letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
    .credits-popup .credits-label { font-size: 10px; color: #7888a0;
      text-transform: uppercase; letter-spacing: 1px; margin: 10px 0 4px; }
    .credits-popup hr { border: none; border-top: 1px solid rgba(150,170,200,0.3); margin: 12px 0; }
    .credits-popup a { color: #a8c0e8; text-decoration: none; }
  </style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
const _params = new URLSearchParams(window.location.search);
const SCREENSAVER_MODE = _params.has('screensaver');
const DELAYED_START    = _params.has('delayedStart');
const START_AT         = parseInt(_params.get('startAt') || '0', 10);

// Per-animation params
const P_SPEED          = parseFloat(_params.get('speed')         || '1.0');
const P_COMPLEXITY    = parseInt(_params.get('complexity')     || '3', 10);
const P_PHOSPHOR_DECAY = parseFloat(_params.get('phosphorDecay') || '0.92');
const P_NOISE          = parseFloat(_params.get('noise')         || '0.2');
const P_PALETTE        = _params.get('palette')                  || 'phosphor';
const P_SHAPE_OVERRIDE = _params.get('shape') || '';
const P_SHAPE_SET    = _params.get('shapeSet')                  || 'all';
const P_CYCLE_PERIOD = parseFloat(_params.get('cyclePeriod')    || '14');
const P_MORPH_TIME   = parseFloat(_params.get('morphTime')      || '1.5');

const config = {
  speed: P_SPEED,
  complexity: P_COMPLEXITY,
  phosphorDecay: P_PHOSPHOR_DECAY,
  noise: P_NOISE,
  palette: P_PALETTE,
  shapeSet: P_SHAPE_SET,
  cyclePeriod: P_CYCLE_PERIOD,
  morphTime: P_MORPH_TIME,
};

if (SCREENSAVER_MODE) {
  document.body.classList.add('screensaver-mode');
  const credits = document.createElement('div');
  credits.className = 'credits-popup';
  credits.innerHTML = `
    <h2>ASCII Oscilloscope</h2>
    <p class="credits-label">Animation</p>
    <p>A CRT laboratory instrument left running forever.</p>
    <hr>
    <p class="credits-label">Screensaver Framework</p>
    <p>Developed by Luci Evol<br>under Evol Digital Productions.</p>
    <p style="margin-top:8px"><a href="https://www.evoldigitalproductions.com" tabindex="-1">www.evoldigitalproductions.com</a></p>`;
  document.body.appendChild(credits);
  setTimeout(() => credits.classList.add('visible'), 500);
  setTimeout(() => credits.classList.remove('visible'), 30500);
  setTimeout(() => credits.remove(), 32500);

  let armed = false;
  setTimeout(() => { armed = true; }, 1500);
  const dismiss = () => {
    if (!armed) return;
    try { window.close(); } catch (e) {}
    document.body.innerHTML = '';
    document.body.style.background = '#000';
  };
  window.addEventListener('keydown', dismiss);
  window.addEventListener('mousedown', dismiss);
  window.addEventListener('mousemove', (() => {
    let lastX = -1, lastY = -1, moveCount = 0;
    return (e) => {
      if (lastX === -1) { lastX = e.clientX; lastY = e.clientY; return; }
      if (e.clientX === lastX && e.clientY === lastY) return;
      lastX = e.clientX; lastY = e.clientY;
      if (++moveCount > 10) dismiss();
    };
  })());
}

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let width, height, cx, cy, scale;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  cx = width / 2;
  cy = height / 2;
  scale = Math.min(width, height) * 0.32;
}

window.addEventListener('resize', resize);

// Palette — color of the trace + glow, per phosphor type
const PALETTES = {
  phosphor: { core: '180,255,200', glow: '60,255,140' }, // classic green CRT
  amber:    { core: '255,210,120', glow: '255,160,40' },
  blue:     { core: '160,210,255', glow: '60,140,255' },
};
const palette = PALETTES[config.palette] || PALETTES.phosphor;

// Tiny deterministic noise — used only for the slow "wobble" that keeps
// the curve from being a perfectly static Lissajous.
function smoothNoise(t) {
  return Math.sin(t * 0.7) * 0.5 + Math.sin(t * 1.31 + 1.7) * 0.3 + Math.sin(t * 0.23 + 4.1) * 0.2;
}

// Trace the outline of a regular polygon. s in [0,1) walks the perimeter;
// vertices sit on the unit circle so corners reach radius 1.
function polyPoint(s, sides, rot = -Math.PI / 2) {
  const total = (s % 1 + 1) % 1 * sides;
  const edge = Math.floor(total);
  const f = total - edge;
  const a0 = rot + (edge / sides) * Math.PI * 2;
  const a1 = rot + ((edge + 1) / sides) * Math.PI * 2;
  return {
    x: Math.cos(a0) + (Math.cos(a1) - Math.cos(a0)) * f,
    y: Math.sin(a0) + (Math.sin(a1) - Math.sin(a0)) * f,
  };
}

// Trace a star by alternating outer (radius 1) and inner (radius `inner`) points.
function starPoint(s, points = 5, inner = 0.42) {
  const n = points * 2;
  const total = (s % 1 + 1) % 1 * n;
  const edge = Math.floor(total);
  const f = total - edge;
  const r0 = edge % 2 === 0 ? 1 : inner;
  const r1 = (edge + 1) % 2 === 0 ? 1 : inner;
  const a0 = (edge / n) * Math.PI * 2 - Math.PI / 2;
  const a1 = ((edge + 1) / n) * Math.PI * 2 - Math.PI / 2;
  return {
    x: Math.cos(a0) * r0 + (Math.cos(a1) * r1 - Math.cos(a0) * r0) * f,
    y: Math.sin(a0) * r0 + (Math.sin(a1) * r1 - Math.sin(a0) * r0) * f,
  };
}

// Geometric/waveform shapes walk a perimeter param s = frac(t * RATE).
const GEO_RATE = 0.16;   // ~one loop every ~6s at speed 1
const SWEEP_RATE = 0.16; // horizontal time-base for waveforms

// Shape registry: each entry is f(t) -> {x, y}, normalized to ~[-1, 1].
const SHAPES = {
  // --- Curve families ---
  lissajous(t) {
    const a = config.complexity;
    const b = config.complexity + 1 + Math.sin(t * 0.05) * 0.15;
    const wobble = smoothNoise(t) * config.noise;
    return { x: Math.sin(a * t), y: Math.sin(b * t + Math.PI / 2 + wobble) };
  },
  rose(t) {
    const k = config.complexity;            // petal frequency
    const r = Math.cos(k * t);
    return { x: r * Math.cos(t), y: r * Math.sin(t) };
  },
  spirograph(t) {
    const R = 1, r = 0.33, d = 0.5;
    const norm = (R - r) + d;               // max reach -> normalize
    const k = (R - r) / r;
    return {
      x: ((R - r) * Math.cos(t) + d * Math.cos(k * t)) / norm,
      y: ((R - r) * Math.sin(t) - d * Math.sin(k * t)) / norm,
    };
  },
  harmonograph(t) {
    return {
      x: (Math.sin(2 * t) + Math.sin(3.01 * t + 1.3)) / 2,
      y: (Math.sin(2.99 * t + 0.7) + Math.sin(2 * t + 2.1)) / 2,
    };
  },
  butterfly(t) {
    const r = (Math.exp(Math.sin(t)) - 2 * Math.cos(4 * t)
               + Math.pow(Math.sin((2 * t - Math.PI) / 24), 5)) / 4.2;
    return { x: Math.sin(t) * r, y: Math.cos(t) * r };
  },

  // --- Geometric figures ---
  circle(t) {
    const a = (t * GEO_RATE) * Math.PI * 2;
    return { x: Math.cos(a), y: Math.sin(a) };
  },
  square(t)   { return polyPoint(t * GEO_RATE, 4, Math.PI / 4); },
  triangle(t) { return polyPoint(t * GEO_RATE, 3); },
  star(t)     { return starPoint(t * GEO_RATE, 5); },
  polygon(t)  { return polyPoint(t * GEO_RATE, Math.max(3, config.complexity + 2)); },
  infinity(t) {
    const a = (t * GEO_RATE) * Math.PI * 2;  // lemniscate of Gerono
    return { x: Math.cos(a), y: Math.sin(a) * Math.cos(a) * 2 };
  },

  // --- Waveform classics: horizontal sweep x, signal y ---
  sineWave(t)     { return { x: sweepX(t), y: Math.sin(wavePhase(t)) }; },
  squareWave(t)   { return { x: sweepX(t), y: Math.sign(Math.sin(wavePhase(t))) * 0.9 }; },
  triangleWave(t) { return { x: sweepX(t), y: (2 / Math.PI) * Math.asin(Math.sin(wavePhase(t))) }; },
  sawWave(t)      {
    const s = (t * SWEEP_RATE % 1 + 1) % 1;
    return { x: s * 2 - 1, y: ((s * config.complexity) % 1) * 2 - 1 };
  },
};

// Waveform sweep helpers.
function sweepX(t) { return (((t * SWEEP_RATE) % 1 + 1) % 1) * 2 - 1; }
function wavePhase(t) {
  const s = (((t * SWEEP_RATE) % 1 + 1) % 1);
  return s * Math.PI * 2 * config.complexity;
}

const SHAPE_GROUPS = {
  curves:    ['lissajous', 'rose', 'spirograph', 'harmonograph', 'butterfly'],
  geometric: ['circle', 'square', 'triangle', 'star', 'polygon', 'infinity'],
  waveforms: ['sineWave', 'squareWave', 'triangleWave', 'sawWave'],
};
SHAPE_GROUPS.all = [...SHAPE_GROUPS.curves, ...SHAPE_GROUPS.geometric, ...SHAPE_GROUPS.waveforms];

function resolveShapeSet(name) {
  return SHAPE_GROUPS[name] || SHAPE_GROUPS.all;
}

function smoothstep(m) { return m <= 0 ? 0 : m >= 1 ? 1 : m * m * (3 - 2 * m); }

// Cycle state
const activeShapes = SHAPES[P_SHAPE_OVERRIDE]
  ? [P_SHAPE_OVERRIDE]                 // pinned via ?shape=
  : resolveShapeSet(config.shapeSet);
let curName  = activeShapes[Math.floor(Math.random() * activeShapes.length)];
let nextName = null;
let holdTimer = 0;   // seconds the current shape has been held
let morphM = 0;      // 0..1 while morphing

function pickNextShape() {
  if (activeShapes.length < 2) return null;
  let n = curName;
  while (n === curName) n = activeShapes[Math.floor(Math.random() * activeShapes.length)];
  return n;
}

// Trail ring — stores recent points so we can vary brightness/width by age,
// in addition to the canvas-level phosphor fade.
const MAX_TRAIL = 1400;
const trail = []; // {x, y, brightness}

// State
let t = 0;
let lastPx = -1, lastPy = -1;

function update(dt) {
  t += dt * config.speed;

  // Advance the cycle / morph clock.
  if (nextName) {
    morphM += dt / config.morphTime;
    if (morphM >= 1) { curName = nextName; nextName = null; morphM = 0; holdTimer = 0; }
  } else {
    holdTimer += dt;
    if (holdTimer >= config.cyclePeriod) { nextName = pickNextShape(); morphM = 0; }
  }

  // Beam position: interpolate from current shape into next during a morph.
  const a = SHAPES[curName](t);
  let pos = a;
  if (nextName) {
    const b = SHAPES[nextName](t);
    const m = smoothstep(morphM);
    pos = { x: a.x + (b.x - a.x) * m, y: a.y + (b.y - a.y) * m };
  }

  const px = cx + pos.x * scale;
  const py = cy + pos.y * scale;

  // Brightness from beam speed: longer segment = faster sweep = dimmer.
  let brightness = 0.8;
  if (lastPx !== -1) {
    const seg = Math.hypot(px - lastPx, py - lastPy);
    brightness = Math.max(0.15, 1 / (1 + seg * 0.03));
  }
  lastPx = px;
  lastPy = py;

  trail.push({ x: px, y: py, brightness });
  if (trail.length > MAX_TRAIL) trail.shift();
}

function drawScanlines() {
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  for (let y = 0; y < height; y += 3) {
    ctx.fillRect(0, y, width, 1);
  }
}

function render() {
  // Phosphor decay: paint translucent black instead of clearing.
  ctx.fillStyle = `rgba(0,0,0,${1 - config.phosphorDecay})`;
  ctx.fillRect(0, 0, width, height);

  // Subtle screen curvature vignette
  const vignette = ctx.createRadialGradient(cx, cy, scale * 0.5, cx, cy, Math.max(width, height) * 0.75);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, width, height);

  // Draw trail oldest→newest
  ctx.globalCompositeOperation = 'lighter';
  const n = trail.length;
  for (let i = 1; i < n; i++) {
    const p0 = trail[i - 1];
    const p1 = trail[i];
    const age = i / n;
    const alpha = Math.pow(age, 1.5) * p1.brightness;

    ctx.strokeStyle = `rgba(${palette.core},${alpha})`;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.stroke();

    if (i === n - 1) {
      ctx.fillStyle = `rgba(${palette.glow},${0.9})`;
      ctx.beginPath();
      ctx.arc(p1.x, p1.y, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';

  drawScanlines();
}

let lastTime = performance.now();
function frame(now) {
  const dt = Math.min((now - lastTime) / 1000, 1 / 30);
  lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

function startAnimation() {
  canvas.style.opacity = '1';
  document.fonts.ready.then(() => {
    resize();
    loop();
  });
}

function loop() {
  frame(performance.now());
}

if (START_AT > 0)        setTimeout(startAnimation, Math.max(100, START_AT - Date.now()));
else if (DELAYED_START)  setTimeout(startAnimation, 4000);
else                     setTimeout(startAnimation, 500);
</script>
</body>
</html>
