<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Black Hole</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a12;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        body.screensaver-mode { cursor: none; }

        #bh-canvas {
            display: block;
            opacity: 0;
            transition: opacity 2s ease-in;
        }

        .credits-popup {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background: rgba(10, 10, 18, 0.92);
            border: 1px solid rgba(180, 80, 20, 0.35);
            border-radius: 8px;
            padding: 20px 24px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 12px;
            color: #a06030;
            max-width: 280px;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            z-index: 100;
            line-height: 1.6;
        }
        .credits-popup.visible { opacity: 1; }
        .credits-popup h2 {
            font-size: 14px;
            font-weight: 700;
            color: #ff8040;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .credits-popup .credits-label {
            font-size: 10px;
            color: #704020;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            margin-bottom: 4px;
        }
        .credits-popup hr {
            border: none;
            border-top: 1px solid rgba(180, 80, 20, 0.25);
            margin: 12px 0;
        }
        .credits-popup a { color: #c05020; text-decoration: none; }
    </style>
</head>
<body>
<canvas id="bh-canvas"></canvas>
<script>
// ─── Screensaver mode ──────────────────────────────────────────────────────────
const _params = new URLSearchParams(window.location.search);
const DELAYED_START    = _params.has('delayedStart');
const START_AT         = parseInt(_params.get('startAt') || '0', 10);

const P_SPEED       = parseFloat(_params.get('speed')       || '1');
const P_PALETTE     = _params.get('palette') || 'fire';
const P_DISK_SIZE   = parseFloat(_params.get('diskSize')    || '1');
const P_JETS        = parseInt(_params.get('jets')          || '1', 10);
const P_INCLINATION = parseFloat(_params.get('inclination') || '0.36');

// ─── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('bh-canvas');
const ctx    = canvas.getContext('2d');

const FONT_SIZE = 15;
let CHAR_W = 9.0, CHAR_H = 18.75;
let cols = 0, rows = 0;
let W = 0, H = 0;
let CX = 0, CY = 0, R_H = 0; // black hole center (px) and event horizon radius (px)

function resize() {
    canvas.width  = W = window.innerWidth;
    canvas.height = H = window.innerHeight;
    ctx.font = `${FONT_SIZE}px 'JetBrains Mono', 'Courier New', monospace`;
    CHAR_W = ctx.measureText('M').width;
    CHAR_H = FONT_SIZE * 1.25;
    cols = Math.floor(W / CHAR_W);
    rows = Math.floor(H / CHAR_H);
    CX = W * 0.50;
    CY = H * 0.48;
    R_H = Math.min(W, H) * 0.20;
}

window.addEventListener('resize', resize);

// ─── Disk geometry ─────────────────────────────────────────────────────────────
const SIN_INC    = Math.max(0.05, Math.min(0.95, P_INCLINATION));
const DISK_INNER = 1.08;
const BH_DISK_OUTER = 4.20 * P_DISK_SIZE;
const DISK_H     = 0.28;

// ─── Palettes ──────────────────────────────────────────────────────────────────
const BH_PALETTES = {
    fire: {
        segs: [
            { t: 0.00, r: 255, g: 255, b: 255 },
            { t: 0.18, r: 255, g: 235, b: 95  },
            { t: 0.40, r: 255, g: 180, b: 25  },
            { t: 0.68, r: 255, g: 50,  b: 15  },
            { t: 1.00, r: 135, g: 15,  b: 15  },
        ],
        jetColor:    '#4080e0',
        coronaColor: '#ff7020',
        ringColor:   (peak) => `rgb(255,${Math.round(240+peak*15)},${Math.round(180+peak*75)})`,
    },
    cool: {
        segs: [
            { t: 0.00, r: 220, g: 240, b: 255 },
            { t: 0.18, r: 100, g: 220, b: 255 },
            { t: 0.40, r: 40,  g: 120, b: 255 },
            { t: 0.68, r: 80,  g: 40,  b: 200 },
            { t: 1.00, r: 40,  g: 10,  b: 100 },
        ],
        jetColor:    '#80d0ff',
        coronaColor: '#2060c0',
        ringColor:   (peak) => `rgb(${Math.round(160+peak*95)},${Math.round(210+peak*45)},255)`,
    },
    plasma: {
        segs: [
            { t: 0.00, r: 255, g: 220, b: 255 },
            { t: 0.18, r: 255, g: 60,  b: 220 },
            { t: 0.40, r: 180, g: 30,  b: 180 },
            { t: 0.68, r: 120, g: 10,  b: 80  },
            { t: 1.00, r: 60,  g: 5,   b: 30  },
        ],
        jetColor:    '#c040e0',
        coronaColor: '#8020a0',
        ringColor:   (peak) => `rgb(255,${Math.round(80+peak*120)},255)`,
    },
    mono: {
        segs: [
            { t: 0.00, r: 255, g: 255, b: 255 },
            { t: 0.18, r: 200, g: 200, b: 200 },
            { t: 0.40, r: 140, g: 140, b: 140 },
            { t: 0.68, r: 80,  g: 80,  b: 80  },
            { t: 1.00, r: 30,  g: 30,  b: 30  },
        ],
        jetColor:    '#aaaaaa',
        coronaColor: '#606060',
        ringColor:   (peak) => { const v = Math.round(200+peak*55); return `rgb(${v},${v},${v})`; },
    },
};
const BHP = BH_PALETTES[P_PALETTE] || BH_PALETTES.fire;

// ─── Stars ─────────────────────────────────────────────────────────────────────
let stars = [];
function initStars() {
    stars = [];
    for (let i = 0; i < 180; i++) {
        stars.push({
            ox: Math.random() * W,  // original position before lensing
            oy: Math.random() * H,
            char:     Math.random() < 0.15 ? '*' : '.',
            base:     0.20 + Math.random() * 0.60,
            twinkle:  Math.random() * Math.PI * 2,
            speed:    0.3 + Math.random() * 1.8,
        });
    }
}

// Simple Schwarzschild-inspired deflection: stars pushed outward near the hole
function lensedPos(ox, oy) {
    const dx = ox - CX, dy = oy - CY;
    const r  = Math.sqrt(dx * dx + dy * dy);
    if (r < R_H * 1.3) return null; // swallowed / hidden
    const deflect = (R_H * R_H * R_H) / (r * r) * 0.9;
    return { x: ox + (dx / r) * deflect, y: oy + (dy / r) * deflect };
}

function drawStars(t) {
    ctx.font = `${FONT_SIZE}px 'JetBrains Mono', 'Courier New', monospace`;
    ctx.textBaseline = 'top';
    for (const s of stars) {
        const pos = lensedPos(s.ox, s.oy);
        if (!pos) continue;
        const a = s.base * (0.5 + 0.5 * Math.sin(t * s.speed * 0.001 + s.twinkle));
        ctx.globalAlpha = a * 0.65;
        ctx.fillStyle   = '#5a6a8a';
        ctx.fillText(s.char, pos.x, pos.y);
    }
    ctx.globalAlpha = 1;
}

// ─── Disk color ────────────────────────────────────────────────────────────────
function diskColor(diskR) {
    const t    = Math.max(0, Math.min(1, (diskR - DISK_INNER) / (BH_DISK_OUTER - DISK_INNER)));
    const segs = BHP.segs;
    for (let i = 0; i < segs.length - 1; i++) {
        if (t <= segs[i + 1].t) {
            const m = (t - segs[i].t) / (segs[i + 1].t - segs[i].t);
            return [
                Math.round(segs[i].r + m * (segs[i+1].r - segs[i].r)),
                Math.round(segs[i].g + m * (segs[i+1].g - segs[i].g)),
                Math.round(segs[i].b + m * (segs[i+1].b - segs[i].b)),
            ];
        }
    }
    const last = segs[segs.length - 1];
    return [last.r, last.g, last.b];
}

// ─── Character sets ────────────────────────────────────────────────────────────
const CHARS_HOT  = ['@', '#', '8', 'O', '0'];
const CHARS_MID  = ['*', 'o', '+', '=', 'x'];
const CHARS_COOL = ['.', ',', ':', ';', '`'];
const CHARS_RING = ['@', '#', '*', '+', 'o'];

// ─── Animation time ────────────────────────────────────────────────────────────
let animTime = 0;

// ─── Render ────────────────────────────────────────────────────────────────────
function render(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.font = `${FONT_SIZE}px 'JetBrains Mono', 'Courier New', monospace`;
    ctx.textBaseline = 'top';

    drawStars(t);

    // Relativistic jets: faint vertical beams above and below
    if (P_JETS) {
        const jetW  = Math.max(1, Math.floor(R_H / CHAR_W * 0.15));
        const jetCX = Math.floor(CX / CHAR_W);
        const diskTopY = Math.floor((CY - R_H * 1.05) / CHAR_H);
        for (let gy = 0; gy < diskTopY; gy++) {
            const dist = diskTopY - gy;
            const jetFade = Math.exp(-dist / (rows * 0.35));
            if (jetFade < 0.01) continue;
            for (let dx = -jetW; dx <= jetW; dx++) {
                const gx = jetCX + dx;
                if (gx < 0 || gx >= cols) continue;
                const widthFade = 1 - Math.abs(dx) / (jetW + 1);
                const swirl = Math.sin(animTime * 4 + gy * 0.4) * 0.5 + 0.5;
                ctx.globalAlpha = jetFade * widthFade * swirl * 0.45;
                ctx.fillStyle = BHP.jetColor;
                ctx.fillText(swirl > 0.6 ? '|' : ':', gx * CHAR_W, gy * CHAR_H);
            }
        }
        const diskBotY = Math.ceil((CY + R_H * 1.05) / CHAR_H);
        for (let gy = diskBotY; gy < rows; gy++) {
            const dist = gy - diskBotY;
            const jetFade = Math.exp(-dist / (rows * 0.35));
            if (jetFade < 0.01) continue;
            for (let dx = -jetW; dx <= jetW; dx++) {
                const gx = jetCX + dx;
                if (gx < 0 || gx >= cols) continue;
                const widthFade = 1 - Math.abs(dx) / (jetW + 1);
                const swirl = Math.sin(animTime * 4 + gy * 0.4) * 0.5 + 0.5;
                ctx.globalAlpha = jetFade * widthFade * swirl * 0.45;
                ctx.fillStyle = BHP.jetColor;
                ctx.fillText(swirl > 0.6 ? '|' : ':', gx * CHAR_W, gy * CHAR_H);
            }
        }
    }

    // Main grid: disk + photon ring + event horizon
    const bbPad = BH_DISK_OUTER + 0.3;
    const gxMin = Math.max(0, Math.floor((CX - R_H * bbPad) / CHAR_W));
    const gxMax = Math.min(cols, Math.ceil( (CX + R_H * bbPad) / CHAR_W));
    const gyMin = Math.max(0, Math.floor((CY - R_H * bbPad) / CHAR_H));
    const gyMax = Math.min(rows, Math.ceil( (CY + R_H * bbPad) / CHAR_H));

    for (let gy = gyMin; gy < gyMax; gy++) {
        for (let gx = gxMin; gx < gxMax; gx++) {
            const px = gx * CHAR_W + CHAR_W * 0.5;
            const py = gy * CHAR_H + CHAR_H * 0.5;
            const dx = px - CX, dy = py - CY;
            const r2 = dx * dx + dy * dy;
            const r  = Math.sqrt(r2);
            const nr = r / R_H; // normalised pixel-space radius

            if (nr > bbPad) continue;

            const nx = dx / R_H;
            const ny = dy / R_H;

            // ── Event horizon: completely dark ──────────────────────────────
            if (nr < 0.98) continue;

            // ── Photon ring (1.0–1.3 R_H) ─────────────────────────────────
            if (nr < 1.30) {
                const rt  = (nr - 0.98) / 0.32; // 0=inner edge, 1=outer edge
                // Narrow bright peak at nr~1.05
                const peak = Math.exp(-Math.pow((nr - 1.06) / 0.09, 2));
                const flicker = 0.75 + 0.25 * Math.sin(animTime * 5 + Math.atan2(ny, nx) * 12);
                const alpha   = peak * flicker;
                if (alpha < 0.05) continue;
                const cidx = Math.floor((1 - peak) * CHARS_RING.length);
                ctx.globalAlpha = alpha;
                ctx.fillStyle   = BHP.ringColor(peak);
                ctx.fillText(CHARS_RING[Math.max(0, Math.min(cidx, CHARS_RING.length - 1))],
                             gx * CHAR_W, gy * CHAR_H);
                continue;
            }

            // ── Accretion disk ─────────────────────────────────────────────
            // De-project y to disk-plane coordinates
            const ny_d  = ny / SIN_INC;
            const disk_r = Math.sqrt(nx * nx + ny_d * ny_d);

            if (disk_r >= DISK_INNER && disk_r <= BH_DISK_OUTER) {
                // Check disk thickness (thin band around equatorial plane)
                const disk_h_at_r = DISK_H * disk_r;
                const above_plane = Math.abs(ny_d);

                if (above_plane < disk_h_at_r) {
                    const disk_angle = Math.atan2(ny_d, nx);

                    // Relativistic doppler: right side receding → dimmer, left approaching → brighter
                    const rotAngle = disk_angle + animTime * 0.25;
                    const doppler  = 0.30 + 0.70 * (0.5 + 0.5 * Math.cos(rotAngle + Math.PI));

                    // Radial brightness: inner edge is hottest
                    const radialT  = (disk_r - DISK_INNER) / (BH_DISK_OUTER - DISK_INNER);
                    const radial   = Math.pow(1 - radialT, 2.0);

                    // Vertical fade from disk midplane
                    const vFade = Math.pow(1 - above_plane / disk_h_at_r, 0.6);

                    // Far side of disk (lensed, appears above horizon) is dimmer
                    const farSide = ny_d < 0 && ny > 0;
                    const sideMul = farSide ? 0.40 : 1.0;

                    const brightness = radial * doppler * vFade * sideMul;
                    if (brightness < 0.03) continue;

                    // Animated swirl character selection
                    const swirl = animTime * 1.8 + disk_angle * 4 + disk_r * 2;
                    let chars;
                    if (brightness > 0.55) chars = CHARS_HOT;
                    else if (brightness > 0.22) chars = CHARS_MID;
                    else chars = CHARS_COOL;
                    const ch = chars[Math.floor(Math.abs(Math.sin(swirl)) * chars.length)];

                    const [cr, cg, cb] = diskColor(disk_r);
                    ctx.globalAlpha = Math.min(1, brightness * 1.3);
                    ctx.fillStyle   = `rgb(${cr},${cg},${cb})`;
                    ctx.fillText(ch, gx * CHAR_W, gy * CHAR_H);
                    continue;
                }
            }

            // ── Diffuse corona / glow between photon ring and inner disk ───
            if (nr < 1.8 && disk_r > 0.8) {
                const coronaFade = Math.exp(-Math.pow(nr - 1.15, 2) / 0.12) * 0.12;
                if (coronaFade > 0.01) {
                    ctx.globalAlpha = coronaFade;
                    ctx.fillStyle   = BHP.coronaColor;
                    ctx.fillText('.', gx * CHAR_W, gy * CHAR_H);
                }
            }
        }
    }

    ctx.globalAlpha = 1;
}

// ─── Loop ──────────────────────────────────────────────────────────────────────
let raf;

function loop(t) {
    animTime += 0.018 * P_SPEED;
    render(t);
    raf = requestAnimationFrame(loop);
}

// ─── Entry point ───────────────────────────────────────────────────────────────
function startAnimation() {
    canvas.style.opacity = '1';
    document.fonts.ready.then(() => {
        resize();
        initStars();
        raf = requestAnimationFrame(loop);
    });
}

if (START_AT > 0) {
    const delay = Math.max(100, START_AT - Date.now());
    setTimeout(startAnimation, delay);
} else if (DELAYED_START) {
    setTimeout(startAnimation, 4000);
} else {
    setTimeout(startAnimation, 500);
}
</script>
</body>
</html>
