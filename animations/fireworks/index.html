<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Fireworks</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #05050b;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #fw-canvas {
            display: block;
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }
    </style>
</head>
<body>
<canvas id="fw-canvas"></canvas>
<script>
// ─── Parameters ──────────────────────────────────────────────────────────────
const _params = new URLSearchParams(window.location.search);
const P_FREQ    = clamp(parseFloat(_params.get('frequency') || '1'), 0.1, 3);
const P_COUNT   = clamp(parseInt(_params.get('particleCount') || '50', 10), 10, 200);
const P_GRAVITY = clamp(parseFloat(_params.get('gravity') || '1'), 0, 3);
const P_PALETTE = _params.get('palette') || 'multi';
const START_AT  = parseInt(_params.get('startAt') || '0', 10);
const DELAYED_START = _params.has('delayedStart');

function clamp(v, lo, hi) { return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : lo; }
function rand(a, b) { return a + Math.random() * (b - a); }
function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

// Each palette picks a burst colour: [hue, saturation %, lightness %].
const PALETTES = {
    multi:  () => [rand(0, 360), 95, 62],
    warm:   () => [rand(-15, 50), 100, 60],
    cool:   () => [rand(165, 270), 95, 64],
    gold:   () => [rand(35, 52), 100, rand(55, 72)],
    pastel: () => [rand(0, 360), 90, 80],
};
const nextColor = PALETTES[P_PALETTE] || PALETTES.multi;
const hsl = (h, s, l, a = 1) => `hsla(${h.toFixed(0)},${s}%,${l.toFixed(0)}%,${a.toFixed(3)})`;

// ─── Canvas ──────────────────────────────────────────────────────────────────
// Re-measured on every resize: the window may not have its real size yet
// when this script first runs, and a canvas sized once at 0x0 draws nothing.
const canvas = document.getElementById('fw-canvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let FS = 16;          // glyph size
let groundY = 0;      // top of the tallest part of the skyline band
let skyline = null;   // offscreen canvas with the city drawn in ASCII
let windows = [];     // lit-window positions, flickered each frame
const glyphCache = new Map();
// Glyphs cached before the web font arrived were drawn in the fallback font.
if (document.fonts) document.fonts.ready.then(() => glyphCache.clear());

// Each (glyph, colour) is rendered once into a sprite and stamped with
// drawImage — far cheaper than fillText for hundreds of sparks a frame.
// Hue is rounded to 6 degrees and lightness to 5 %; fading is alpha.
function sprite(ch, h, s, l) {
    h = ((Math.round(h / 6) * 6) % 360 + 360) % 360;
    l = Math.round(l / 5) * 5;
    const key = ch + h + ',' + s + ',' + l;
    let g = glyphCache.get(key);
    if (!g) {
        if (glyphCache.size > 3000) glyphCache.clear();
        const w = Math.ceil(FS * 0.8) + 4, hh = Math.ceil(FS * 1.3) + 4;
        const c = document.createElement('canvas');
        c.width = Math.ceil(w * DPR); c.height = Math.ceil(hh * DPR);
        const x = c.getContext('2d');
        x.scale(DPR, DPR);
        x.font = `700 ${FS}px "JetBrains Mono", monospace`;
        x.textAlign = 'center';
        x.textBaseline = 'middle';
        x.fillStyle = `hsl(${h},${s}%,${l}%)`;
        x.fillText(ch, w / 2, hh / 2);
        g = { c, w, h: hh };
        glyphCache.set(key, g);
    }
    return g;
}
function stamp(ch, x, y, h, s, l, alpha) {
    const g = sprite(ch, h, s, l);
    ctx.globalAlpha = alpha;
    ctx.drawImage(g.c, x - g.w / 2, y - g.h / 2, g.w, g.h);
}

function resize() {
    // 1:1 CSS pixels like the other animations: on a scaled display a
    // device-resolution canvas costs ~1.5-2x the GPU upload every frame.
    DPR = 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    FS = clamp(Math.round(Math.min(W, H) / 48), 11, 22);
    glyphCache.clear();
    buildSkyline();
    ctx.fillStyle = '#05050b';
    ctx.fillRect(0, 0, W, H);
}

// ─── The city ────────────────────────────────────────────────────────────────
function buildSkyline() {
    const cw = FS * 0.62, rh = FS * 1.05;
    const cols = Math.ceil(W / cw);
    const maxRows = Math.max(3, Math.floor((H * 0.2) / rh));
    skyline = document.createElement('canvas');
    skyline.width = Math.max(1, Math.round(W * DPR));
    skyline.height = Math.max(1, Math.round(H * DPR));
    const g = skyline.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.font = `${FS}px "JetBrains Mono", monospace`;
    g.textBaseline = 'bottom';
    windows = [];

    let col = 0;
    let tallest = H;
    while (col < cols) {
        const w = Math.floor(rand(4, 11));
        const rows = Math.floor(rand(2, maxRows + 1));
        const top = H - rows * rh;
        tallest = Math.min(tallest, top - rh);
        // Solid silhouette so the fading sky never smears into it.
        g.fillStyle = '#05050b';
        g.fillRect(col * cw, top - rh, w * cw, rows * rh + rh);
        for (let r = 0; r <= rows; r++) {
            for (let c = 0; c < w; c++) {
                const x = (col + c) * cw, y = H - r * rh;
                const roof = r === rows, edge = c === 0 || c === w - 1;
                let ch = roof ? (edge ? '.' : '_') : edge ? '|' : ' ';
                if (!roof && !edge && r > 0 && (c % 2 === 1) && Math.random() < 0.35) {
                    windows.push({ x, y, on: Math.random() < 0.7, hue: rand(35, 55) });
                    continue;
                }
                if (ch === ' ') continue;
                g.fillStyle = 'rgba(120,130,170,0.35)';
                g.fillText(ch, x, y);
            }
        }
        // An antenna on some rooftops.
        if (rows > maxRows * 0.6 && Math.random() < 0.5) {
            g.fillStyle = 'rgba(120,130,170,0.35)';
            g.fillText('|', (col + Math.floor(w / 2)) * cw, top - rh);
            g.fillStyle = 'rgba(255,70,70,0.8)';
            g.fillText('.', (col + Math.floor(w / 2)) * cw, top - 2 * rh);
        }
        col += w + (Math.random() < 0.3 ? 1 : 0);
    }
    groundY = tallest;
}

window.addEventListener('resize', resize);
resize();

// ─── Rockets and particles ───────────────────────────────────────────────────
const rockets = [];
const sparks = [];
let flash = { h: 0, s: 0, l: 0, a: 0 };

function launch() {
    const x = rand(W * 0.1, W * 0.9);
    const apex = rand(H * 0.12, Math.max(H * 0.2, groundY - H * 0.2));
    // Speed needed to coast up to the apex under gravity.
    const g = 260 * Math.max(P_GRAVITY, 0.25);
    const vy = -Math.sqrt(2 * g * (H - apex));
    rockets.push({ x, y: H, vx: rand(-30, 30), vy, g, color: nextColor(), type: chooseType() });
}

function chooseType() {
    return pick(['peony', 'peony', 'ring', 'willow', 'crossette', 'double', 'heart', 'chrysanthemum']);
}

function spark(x, y, vx, vy, opts) {
    sparks.push(Object.assign({
        x, y, vx, vy,
        life: 0, maxLife: rand(1.1, 1.9),
        drag: 0.985, color: [0, 0, 100], glyphs: '@*+:.', trail: false, split: false,
        flicker: Math.random() < 0.35,
    }, opts));
}

function explode(r) {
    const [h, s, l] = r.color;
    const n = Math.round(P_COUNT * rand(0.9, 1.2));
    const speed = rand(170, 260) * Math.sqrt(Math.min(W, H) / 900);
    // Bursts add to the glow rather than resetting it, capped so a salvo
    // tints the sky instead of flooding it.
    flash = { h, s, l, a: Math.min(0.09, flash.a + 0.05) };

    const ring = (count, v, color, extra) => {
        for (let i = 0; i < count; i++) {
            const a = (i / count) * Math.PI * 2 + rand(-0.05, 0.05);
            spark(r.x, r.y, Math.cos(a) * v, Math.sin(a) * v, Object.assign({ color }, extra));
        }
    };

    switch (r.type) {
    case 'ring':
        ring(n, speed, [h, s, l], { glyphs: 'O0o.' });
        break;
    case 'double': {
        const other = nextColor();
        ring(Math.round(n * 0.6), speed, [h, s, l], { glyphs: '*+.' });
        ring(Math.round(n * 0.4), speed * 0.55, other, { glyphs: '@o.' });
        break;
    }
    case 'willow':
        for (let i = 0; i < n; i++) {
            const a = rand(0, Math.PI * 2), v = speed * Math.sqrt(Math.random()) * 0.9;
            spark(r.x, r.y, Math.cos(a) * v, Math.sin(a) * v,
                  { color: [42, 100, 62], maxLife: rand(2.4, 3.4), drag: 0.965, glyphs: '*:,.\'', trail: true });
        }
        break;
    case 'crossette':
        for (let i = 0; i < Math.round(n / 3); i++) {
            const a = rand(0, Math.PI * 2), v = speed * rand(0.6, 1);
            spark(r.x, r.y, Math.cos(a) * v, Math.sin(a) * v,
                  { color: [h, s, l], maxLife: rand(0.7, 0.9), glyphs: '#+', split: true });
        }
        break;
    case 'heart':
        for (let i = 0; i < n; i++) {
            const tt = (i / n) * Math.PI * 2;
            const hx = 16 * Math.pow(Math.sin(tt), 3);
            const hy = -(13 * Math.cos(tt) - 5 * Math.cos(2 * tt) - 2 * Math.cos(3 * tt) - Math.cos(4 * tt));
            spark(r.x, r.y, hx * speed / 17, hy * speed / 17,
                  { color: [rand(330, 355), 95, 65], glyphs: '<3*.', drag: 0.975 });
        }
        break;
    case 'chrysanthemum':
        for (let i = 0; i < n * 1.3; i++) {
            const a = rand(0, Math.PI * 2), v = speed * Math.sqrt(Math.random());
            spark(r.x, r.y, Math.cos(a) * v, Math.sin(a) * v,
                  { color: [h, s, l], glyphs: '*+:.', trail: true, maxLife: rand(1.4, 2.2) });
        }
        break;
    default: // peony
        for (let i = 0; i < n; i++) {
            const a = rand(0, Math.PI * 2), v = speed * Math.sqrt(Math.random());
            spark(r.x, r.y, Math.cos(a) * v, Math.sin(a) * v, { color: [h + rand(-12, 12), s, l] });
        }
    }
}

// ─── Frame ───────────────────────────────────────────────────────────────────
let lastTs = 0;
let untilLaunch = 0.4;
let untilFinale = rand(35, 55);
let salvo = 0;

function frame(ts) {
    requestAnimationFrame(frame);
    if (window.innerWidth !== W || window.innerHeight !== H) resize();
    if (W === 0 || H === 0) return;
    if (lastTs && ts - lastTs < 31) return;   // ~30 fps is plenty for this
    const dt = Math.min(0.1, lastTs ? (ts - lastTs) / 1000 : 0);
    lastTs = ts;

    // Launch schedule: a steady rhythm, plus an occasional finale salvo.
    untilLaunch -= dt;
    untilFinale -= dt;
    if (untilFinale <= 0) { salvo = Math.floor(rand(8, 14)); untilFinale = rand(40, 70); }
    if (untilLaunch <= 0) {
        launch();
        if (salvo > 0) { salvo--; untilLaunch = rand(0.12, 0.3); }
        else untilLaunch = rand(0.5, 2.2) / P_FREQ;
    }

    // Fade the sky rather than clearing it: that's what leaves the trails.
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    // Same trail length at any frame rate: 22 % per 60 Hz frame.
    ctx.fillStyle = `rgba(5,5,11,${(1 - Math.pow(0.78, dt * 60)).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);

    // A burst lights up the whole sky for a moment.
    if (flash.a > 0.002) {
        const glow = ctx.createLinearGradient(0, 0, 0, H);
        glow.addColorStop(0, hsl(flash.h, flash.s, flash.l, flash.a * 0.3));
        glow.addColorStop(1, hsl(flash.h, flash.s, flash.l, flash.a));
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, W, H);
        flash.a *= Math.pow(0.02, dt);
    }

    ctx.globalCompositeOperation = 'lighter';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `700 ${FS}px "JetBrains Mono", monospace`;

    // Rockets climb, shedding a spark trail, and burst near their apex.
    for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.vy += r.g * dt;
        r.x += r.vx * dt;
        r.y += r.vy * dt;
        stamp('|', r.x, r.y, 40, 100, 80, 0.9);
        if (Math.random() < Math.min(1, 0.8 * dt * 60)) {
            spark(r.x + rand(-2, 2), r.y + FS * 0.6, rand(-15, 15), rand(20, 60),
                  { color: [35, 100, 60], maxLife: rand(0.3, 0.6), glyphs: ':.' });
        }
        if (r.vy > -40) { explode(r); rockets.splice(i, 1); }
    }

    const g = 260 * P_GRAVITY * 0.35;
    for (let i = sparks.length - 1; i >= 0; i--) {
        const p = sparks[i];
        const drag = Math.pow(p.drag, dt * 60);
        p.vx *= drag;
        p.vy = p.vy * drag + g * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life += dt;
        const k = p.life / p.maxLife;
        if (k >= 1 || p.y > H + 20) {
            if (p.split && k >= 1) {
                // Crossette: each star splits into four smaller ones.
                for (let j = 0; j < 4; j++) {
                    const a = j * Math.PI / 2 + rand(-0.2, 0.2), v = rand(90, 140);
                    spark(p.x, p.y, Math.cos(a) * v, Math.sin(a) * v,
                          { color: p.color, maxLife: rand(0.6, 1), glyphs: '+.' });
                }
            }
            sparks.splice(i, 1);
            continue;
        }
        if (p.flicker && k > 0.55 && Math.random() < 0.4) continue;
        if (p.x < -FS || p.x > W + FS || p.y < -FS) continue;
        const [h, s, l] = p.color;
        const glyph = p.glyphs[Math.min(p.glyphs.length - 1, Math.floor(k * p.glyphs.length))];
        const hot = Math.max(0, 1 - k * 4);              // white-hot for the first quarter
        const light = l + hot * hot * (100 - l) * 0.6;
        stamp(glyph, p.x, p.y, h, s, light, Math.pow(1 - k, 1.3));
        if (p.trail && Math.random() < 0.3 * dt * 60) {
            spark(p.x, p.y, p.vx * 0.1, p.vy * 0.1,
                  { color: [h, s, l * 0.8], maxLife: 0.5, glyphs: '.', drag: 0.9 });
        }
    }

    // The city, drawn over the sky, with windows flickering on and off.
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(skyline, 0, 0, W, H);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.font = `${FS}px "JetBrains Mono", monospace`;
    for (const w of windows) {
        if (Math.random() < 0.0015 * dt * 60) w.on = !w.on;
        if (!w.on) continue;
        ctx.fillStyle = hsl(w.hue, 90, 65, 0.55 + flash.a * 2);
        ctx.fillText('#', w.x, w.y);
    }
}

// ─── Start (synchronised across monitors when startAt is given) ─────────────
function start() {
    canvas.style.opacity = 1;
    requestAnimationFrame(frame);
}
if (START_AT > 0) setTimeout(start, Math.max(0, START_AT - Date.now()));
else setTimeout(start, DELAYED_START ? 1500 : 50);
</script>
</body>
</html>
