name: Validate animation PR

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      # The PR's own files — untrusted content, only ever read, never run
      # as validator code. No credentials left in .git/config for it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The validator itself comes from the base branch. Running the PR's
      # copy would let a PR edit validate_animation.py (or validate_pr.py)
      # to pass itself.
      - name: Check out the validator from the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: .trusted
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install validation dependencies
        run: |
          pip install --quiet pillow playwright
          playwright install --with-deps chromium

      - name: Find changed animation folders
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '^animations/' \
            | awk -F/ '{print $1"/"$2}' \
            | sort -u > /tmp/changed_folders.txt
          cat /tmp/changed_folders.txt

      - name: Validate each changed animation
        id: validate
        run: |
          set +e
          python3 .trusted/.github/scripts/validate_pr.py /tmp/changed_folders.txt > /tmp/comment_body.md
          echo "failed=$?" >> "$GITHUB_OUTPUT"

      # Fork PRs get a read-only token, so commenting/closing can fail there;
      # the final step below still sets the real pass/fail status.
      - name: Post validation report as a PR comment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/comment_body.md', 'utf8');
            if (body.trim().length === 0) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Close PR on failure
        if: steps.validate.outputs.failed == '1'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            });

      - name: Fail the workflow if validation failed
        if: steps.validate.outputs.failed == '1'
        run: exit 1
