name: Update index.json on merge

on:
  push:
    branches:
      - main
    paths:
      - "animations/**"

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Regenerate index.json
        run: python3 .github/scripts/generate_index.py

      - name: Commit updated index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || git commit -m "chore: regenerate index.json [skip ci]"
          git push
