name: Update index.json on merge

on:
  push:
    branches:
      - main
    paths:
      - "animations/**"

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Regenerate index.json
        run: python3 .github/scripts/generate_index.py

      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.INDEX_UPDATE_DEPLOY_KEY }}

      # main requires changes to go through a PR with a passing `validate`
      # check, with no bypass for humans or the default GITHUB_TOKEN — this
      # deploy key is the one thing scoped to bypass that, specifically so
      # this narrow, low-risk regeneration can still push directly. See
      # Settings → Rules → "protect main branch" → Bypass list.
      - name: Commit and push directly via the deploy key
        id: direct_push
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "git@github.com:${{ github.repository }}.git"
          git add index.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: regenerate index.json [skip ci]"
          git push

      # Safety net in case the deploy key/bypass is ever removed or
      # misconfigured: fall back to a visible PR instead of failing
      # silently (which is what happened before — see git history around
      # 2026-09-20 for the incident this is guarding against). Note this
      # fallback PR still needs a human to manually trigger the `validate`
      # check and merge it, since GITHUB_TOKEN-authored PRs don't trigger
      # other workflows.
      - name: Fall back to opening a PR
        if: steps.direct_push.outcome == 'failure'
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="automated/update-index-$(date +%s)"
          git checkout -b "$BRANCH"
          git add index.json
          git commit -m "chore: regenerate index.json"
          git push origin "$BRANCH"
          gh pr create --title "chore: regenerate index.json" \
            --body "Automated — direct push via the deploy key failed (it may have been removed, or the ruleset bypass misconfigured). This PR needs a maintainer to manually trigger/re-run the \`validate\` check and merge it, since GITHUB_TOKEN-authored PRs don't auto-trigger other workflows." \
            --base main --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail loudly if the direct push failed
        if: steps.direct_push.outcome == 'failure'
        run: |
          echo "::error::Direct push via the deploy key failed — opened a PR instead, but it needs manual attention. Check that the deploy key still exists (Settings → Deploy keys), the INDEX_UPDATE_DEPLOY_KEY secret is current, and it's still in the ruleset's bypass list."
          exit 1
